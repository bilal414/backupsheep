name: Bootstrap stable release verifier

on:
  push:
    branches:
      - codex/cyber-defense-completion-20260829
    paths:
      - .github/workflows/bootstrap-release-verifier.yml
      - Dockerfile.release-verifier
      - deploy/ci/validate-image-scan.py
      - deploy/release/sigstore-trusted-root.json
      - deploy/release-policy.json
      - deploy/trivy-db-lock.json
      - scripts/install_release_tools.py
      - scripts/preflight_release_verifier_scan.py
      - scripts/prepare_trivy_db.py
      - scripts/promote_release_images.py
      - scripts/publish_stable_release_verifier.py
      - scripts/validate_cosign_image_verification.py
      - scripts/validate_release_verifier_layout.py

# This is a one-time, branch-bound trust bootstrap. It is removed after the
# resulting multi-platform digest and exact image configuration are committed
# to the release consumer. No mutable application release tag is created here.
permissions:
  contents: read

concurrency:
  group: bootstrap-release-verifier
  cancel-in-progress: false

jobs:
  build_scan_publish:
    name: Build, scan, and publish stable verifier
    if: >-
      github.repository == 'bilal414/backupsheep' &&
      github.ref == 'refs/heads/codex/cyber-defense-completion-20260829'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      CANDIDATE_TAG: bootstrap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      EVIDENCE_DIR: ${{ github.workspace }}/release-verifier-bootstrap/evidence
      LAYOUT_DIR: ${{ github.workspace }}/release-verifier-bootstrap/layout
      OFFICIAL_REPOSITORY: ghcr.io/bilal414/backupsheep-release-verifier
      QUARANTINE_REPOSITORY: ghcr.io/bilal414/backupsheep-release-verifier-quarantine
      STABLE_TAG: v3.1.3-backupsheep.1
      TOOL_DIR: /tmp/backupsheep-release-verifier-tools
      TRIVY_CACHE_DIR: /tmp/backupsheep-release-verifier-trivy-cache
      TRIVY_DB_EVIDENCE: /tmp/backupsheep-release-verifier-trivy-db.json
      TRIVY_HOME: /tmp/backupsheep-release-verifier-trivy-home
      RELEASE_DOCKER_CONFIG: /tmp/backupsheep-release-verifier-docker
      SCAN_ROOT: ${{ github.workspace }}/release-verifier-bootstrap/scans
    steps:
      - name: Check out the exact bootstrap source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate branch-bound bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/codex/cyber-defense-completion-20260829
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f Dockerfile.release-verifier
          test ! -L Dockerfile.release-verifier
          for path in \
            "$TOOL_DIR" \
            "$TRIVY_CACHE_DIR" \
            "$TRIVY_DB_EVIDENCE" \
            "$TRIVY_HOME" \
            "$RELEASE_DOCKER_CONFIG" \
            "${LAYOUT_DIR%/layout}"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              printf '%s\n' 'Refusing a pre-existing verifier bootstrap path.' >&2
              exit 1
            fi
          done
          python3 -m py_compile \
            scripts/prepare_trivy_db.py \
            scripts/preflight_release_verifier_scan.py \
            scripts/publish_stable_release_verifier.py \
            scripts/validate_cosign_image_verification.py \
            scripts/validate_release_verifier_layout.py

      - name: Install hash-verified release tools without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/install_release_tools.py \
            --policy deploy/release-policy.json \
            --destination "$TOOL_DIR" \
            --tool cosign \
            --tool oras \
            --tool syft \
            --tool trivy
          test "$("$TOOL_DIR/oras" version | sed -n '1s/^Version: *//p')" = 1.3.3
          "$TOOL_DIR/cosign" version | grep -Eq 'v?3\.1\.3'
          "$TOOL_DIR/syft" version | grep -Eq '1\.51\.0'
          "$TOOL_DIR/trivy" --version | grep -Eq '0\.74\.0'
          grep -qx '{}' "$TOOL_DIR/empty-syft.yaml"
          grep -qx '{}' "$TOOL_DIR/empty-trivy.yaml"
          test ! -s "$TOOL_DIR/empty-trivy.ignore"

      - name: Prepare the reviewed digest-locked vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/prepare_trivy_db.py prepare \
            --lock deploy/trivy-db-lock.json \
            --oras "$TOOL_DIR/oras" \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --evidence "$TRIVY_DB_EVIDENCE"
          python3 scripts/prepare_trivy_db.py verify \
            --lock deploy/trivy-db-lock.json \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --evidence "$TRIVY_DB_EVIDENCE"

      - name: Install pinned QEMU emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64

      - name: Create a pinned BuildKit builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.29.1
          driver-opts: >-
            image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
          use: true

      - name: Prepare private layout and evidence roots
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bootstrap_root="${LAYOUT_DIR%/layout}"
          if [ -e "$bootstrap_root" ] || [ -L "$bootstrap_root" ]; then
            printf '%s\n' 'Refusing a pre-existing verifier bootstrap root.' >&2
            exit 1
          fi
          install -d -m 0700 "$LAYOUT_DIR" "$EVIDENCE_DIR" "$TRIVY_HOME"

      - name: Build the patched multi-platform verifier into a private OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: "1787961600"
        with:
          context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
          file: Dockerfile.release-verifier
          platforms: linux/amd64,linux/arm64
          build-args: BUILDKIT_MULTI_PLATFORM=1
          pull: true
          no-cache: true
          push: false
          outputs: type=oci,dest=${{ github.workspace }}/release-verifier-bootstrap/layout,tar=false,name=${{ env.QUARANTINE_REPOSITORY }}:${{ env.CANDIDATE_TAG }},rewrite-timestamp=true
          tags: ghcr.io/bilal414/backupsheep-release-verifier-quarantine:${{ env.CANDIDATE_TAG }}
          # BuildKit otherwise injects the wall clock into the root descriptor.
          # Bind it to the reviewed patched-build epoch for an exact,
          # reproducible image and outer-layout contract.
          annotations: index-descriptor:org.opencontainers.image.created=2026-08-29T00:00:00Z
          provenance: false
          sbom: false

      - name: Scan both exact child images and validate the complete layout
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # BuildKit may leave its empty OCI ingestion staging directory in an
          # otherwise complete export. Canonicalize only that exact empty
          # directory; unexpected contents or a link fail before either scanner
          # and before registry credentials exist.
          if [ -e "$LAYOUT_DIR/ingest" ] || [ -L "$LAYOUT_DIR/ingest" ]; then
            test -d "$LAYOUT_DIR/ingest"
            test ! -L "$LAYOUT_DIR/ingest"
            test -z "$(find "$LAYOUT_DIR/ingest" -mindepth 1 -print -quit)"
            rmdir -- "$LAYOUT_DIR/ingest"
          fi
          test ! -e "$LAYOUT_DIR/ingest"
          test ! -L "$LAYOUT_DIR/ingest"
          install -m 0600 deploy/trivy-db-lock.json "$EVIDENCE_DIR/trivy-db-lock.json"
          install -m 0600 "$TRIVY_DB_EVIDENCE" "$EVIDENCE_DIR/trivy-db-evidence.json"

          python3 scripts/preflight_release_verifier_scan.py \
            --source-only \
            --layout "$LAYOUT_DIR" \
            --index-digest "$INDEX_DIGEST" \
            --repository "$QUARANTINE_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            > "$EVIDENCE_DIR/release-verifier-source-preflight.json"

          test ! -e "$SCAN_ROOT"
          test ! -L "$SCAN_ROOT"
          install -d -m 0700 "$SCAN_ROOT"
          test "$(stat -c '%a:%u' "$SCAN_ROOT")" = "700:$(id -u)"
          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            scan_layout="$SCAN_ROOT/$architecture"
            test ! -e "$scan_layout"
            test ! -L "$scan_layout"
            env -i \
              HOME="$TRIVY_HOME" \
              LC_ALL=C \
              PATH="$TOOL_DIR:/usr/bin:/bin" \
              "$TOOL_DIR/oras" cp \
                --from-oci-layout \
                --to-oci-layout \
                --platform "$platform" \
                --concurrency 1 \
                --no-tty \
                "$LAYOUT_DIR:$CANDIDATE_TAG" \
                "$scan_layout:scan-$architecture"
            if [ -e "$scan_layout/ingest" ] || [ -L "$scan_layout/ingest" ]; then
              test -d "$scan_layout/ingest"
              test ! -L "$scan_layout/ingest"
              test -z "$(find "$scan_layout/ingest" -mindepth 1 -print -quit)"
              rmdir -- "$scan_layout/ingest"
            fi
            test ! -e "$scan_layout/ingest"
            test ! -L "$scan_layout/ingest"
            test "$(stat -c '%a:%u' "$scan_layout")" = "700:$(id -u)"
          done

          python3 scripts/preflight_release_verifier_scan.py \
            --layout "$LAYOUT_DIR" \
            --index-digest "$INDEX_DIGEST" \
            --repository "$QUARANTINE_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --scan-layout-amd64 "$SCAN_ROOT/amd64" \
            --scan-layout-arm64 "$SCAN_ROOT/arm64" \
            > "$EVIDENCE_DIR/release-verifier-scan-preflight.json"

          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            scan_layout="$SCAN_ROOT/$architecture"
            syft_report="$EVIDENCE_DIR/release-verifier-linux-$architecture.syft.json"
            trivy_report="$EVIDENCE_DIR/release-verifier-linux-$architecture.trivy.json"

            env -i \
              HOME="$TRIVY_HOME" \
              LC_ALL=C \
              PATH="$TOOL_DIR:/usr/bin:/bin" \
              SYFT_CHECK_FOR_APP_UPDATE=false \
              "$TOOL_DIR/syft" \
                --config "$TOOL_DIR/empty-syft.yaml" \
                scan "oci-dir:$scan_layout" \
                --output "syft-json=$syft_report"

            trivy_status=0
            env -i \
              HOME="$TRIVY_HOME" \
              LC_ALL=C \
              PATH="$TOOL_DIR:/usr/bin:/bin" \
              TRIVY_SKIP_VERSION_CHECK=true \
              "$TOOL_DIR/trivy" \
                --cache-dir "$TRIVY_CACHE_DIR" \
                --config "$TOOL_DIR/empty-trivy.yaml" image \
                --input "$scan_layout" \
                --ignorefile "$TOOL_DIR/empty-trivy.ignore" \
                --skip-db-update \
                --skip-java-db-update \
                --skip-check-update \
                --offline-scan \
                --disable-telemetry \
                --no-progress \
                --quiet \
                --scanners vuln \
                --pkg-types os,library \
                --list-all-pkgs \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --timeout 30m \
                --format json \
                --output "$trivy_report" \
              || trivy_status=$?
            test "$trivy_status" -eq 0
            python3 scripts/prepare_trivy_db.py verify \
              --lock deploy/trivy-db-lock.json \
              --cache-dir "$TRIVY_CACHE_DIR" \
              --evidence "$TRIVY_DB_EVIDENCE"
          done

          python3 scripts/validate_release_verifier_layout.py \
            --layout "$LAYOUT_DIR" \
            --index-digest "$INDEX_DIGEST" \
            --repository "$QUARANTINE_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --scan-layout-amd64 "$SCAN_ROOT/amd64" \
            --scan-layout-arm64 "$SCAN_ROOT/arm64" \
            --syft-amd64 "$EVIDENCE_DIR/release-verifier-linux-amd64.syft.json" \
            --trivy-amd64 "$EVIDENCE_DIR/release-verifier-linux-amd64.trivy.json" \
            --syft-arm64 "$EVIDENCE_DIR/release-verifier-linux-arm64.syft.json" \
            --trivy-arm64 "$EVIDENCE_DIR/release-verifier-linux-arm64.trivy.json" \
            --trivy-db-lock "$EVIDENCE_DIR/trivy-db-lock.json" \
            --trivy-db-evidence "$EVIDENCE_DIR/trivy-db-evidence.json" \
            --summary "$EVIDENCE_DIR/release-verifier-layout-summary.json"
          printf '%s\n' "$INDEX_DIGEST" > "$EVIDENCE_DIR/release-verifier.index-digest"
          chmod 0600 "$EVIDENCE_DIR"/*

      - name: Authenticate only after all local evidence passes
        shell: bash
        env:
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          if [ -e "$RELEASE_DOCKER_CONFIG" ] || [ -L "$RELEASE_DOCKER_CONFIG" ]; then
            printf '%s\n' 'Refusing a pre-existing release Docker configuration.' >&2
            exit 1
          fi
          install -d -m 0700 "$RELEASE_DOCKER_CONFIG"
          printf '%s' "$RELEASE_REGISTRY_TOKEN" | \
            docker --config "$RELEASE_DOCKER_CONFIG" login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin
          test -f "$RELEASE_DOCKER_CONFIG/config.json"
          test ! -L "$RELEASE_DOCKER_CONFIG/config.json"
          chmod 0600 "$RELEASE_DOCKER_CONFIG/config.json"

      - name: Publish only the exact validated layout
        id: publish
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RELEASE_DOCKER_CONFIG"
          python3 scripts/publish_stable_release_verifier.py \
            --layout "$LAYOUT_DIR" \
            --index-digest "$INDEX_DIGEST" \
            --quarantine-repository "$QUARANTINE_REPOSITORY" \
            --candidate-tag "$CANDIDATE_TAG" \
            --official-repository "$OFFICIAL_REPOSITORY" \
            --stable-tag "$STABLE_TAG" \
            --oras "$TOOL_DIR/oras" \
            --evidence "$EVIDENCE_DIR/release-verifier-publication.json"

      - name: Sign and verify the official index and both child manifests
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RELEASE_DOCKER_CONFIG"
          unset COSIGN_PASSWORD
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/bootstrap-release-verifier.yml@${GITHUB_REF}"
          issuer=https://token.actions.githubusercontent.com

          sign_and_verify() {
            local label="$1"
            local digest="$2"
            local reference="${OFFICIAL_REPOSITORY}@${digest}"
            local bundle="$EVIDENCE_DIR/${label}.sigstore.json"
            local verification="$EVIDENCE_DIR/${label}.verified.json"
            local summary="$EVIDENCE_DIR/${label}.verification-summary.json"
            "$TOOL_DIR/cosign" sign --yes --oidc-provider github-actions \
              --bundle "$bundle" "$reference"
            "$TOOL_DIR/cosign" verify \
              --trusted-root deploy/release/sigstore-trusted-root.json \
              --output json \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-trigger push \
              "$reference" >"$verification"
            python3 scripts/validate_cosign_image_verification.py \
              --verification "$verification" \
              --bundle "$bundle" \
              --repository "$OFFICIAL_REPOSITORY" \
              --digest "$digest" >"$summary"
          }

          sign_and_verify release-verifier-index "$INDEX_DIGEST"
          while IFS=$'\t' read -r platform child_digest; do
            slug="${platform//\//-}"
            sign_and_verify "release-verifier-$slug" "$child_digest"
          done < <(
            python3 - "$EVIDENCE_DIR/release-verifier-layout-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          summary = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for platform in ("linux/amd64", "linux/arm64"):
              print(platform, summary["platforms"][platform]["manifest_digest"], sep="\t")
          PY
          )

      - name: Execute both published verifier binaries under the consumer sandbox
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RELEASE_DOCKER_CONFIG"
          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            docker --config "$RELEASE_DOCKER_CONFIG" pull \
              --platform "$platform" "$OFFICIAL_REPOSITORY@$INDEX_DIGEST"
            docker run --rm \
              --platform "$platform" \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --pids-limit 64 \
              --memory 256m \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532 \
              "$OFFICIAL_REPOSITORY@$INDEX_DIGEST" version \
              | grep -Fq 'v3.1.3-backupsheep.1'
          done

      - name: Remove registry credentials and retain non-secret evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RELEASE_DOCKER_CONFIG" ] && [ ! -L "$RELEASE_DOCKER_CONFIG" ]; then
            find "$RELEASE_DOCKER_CONFIG" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$RELEASE_DOCKER_CONFIG"
          fi
          test ! -e "$RELEASE_DOCKER_CONFIG"
          if [ -d "$EVIDENCE_DIR" ] && [ ! -L "$EVIDENCE_DIR" ]; then
            test -z "$(find "$EVIDENCE_DIR" -type l -print -quit)"
            find "$EVIDENCE_DIR" -type f -exec chmod 0600 {} +
          fi

      - name: Upload exact bootstrap evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verifier-bootstrap-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-verifier-bootstrap/evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
