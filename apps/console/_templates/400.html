{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <title>400 — Bad request</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="author" content="BackupSheep">
    <link rel="shortcuticon" href="{% static 'console/images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'console/images/favicon.ico' %}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link type="text/css" href="{% static 'console/css/compiled.css' %}" rel="stylesheet">
</head>
<body class="h-full bg-slate-50 antialiased">
<main class="grid min-h-full place-items-center px-6 py-16 sm:py-24">
    <div class="w-full max-w-md text-center">
        <img class="mx-auto h-9 w-auto" src="{% static 'console/images/logo.webp' %}" alt="BackupSheep">
        <p class="mt-10 text-7xl font-bold tracking-tight text-slate-200 sm:text-8xl">400</p>
        <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Bad request</h1>
        <p class="mt-2 text-sm text-slate-500">The request couldn’t be understood. Please check the link and try again.</p>
        <div class="mt-8">
            <a href="{% url 'console:home:index' %}"
               class="inline-flex items-center justify-center gap-x-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition-colors">
                Back to dashboard
            </a>
        </div>
    </div>
</main>
</body>
</html>
