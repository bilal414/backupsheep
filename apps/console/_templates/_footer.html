{% for message in messages %}
    <div class="bs-shell-v3__message {% if message.tags == 'error' %}is-error{% endif %}">
        <span class="bs-shell-v3__message-icon" aria-hidden="true">{% if message.tags == 'error' %}!{% else %}✓{% endif %}</span>
        <p>{{ message }}</p>
    </div>
{% endfor %}
