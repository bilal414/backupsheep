<div x-data="headerNav"
     class="sticky top-0 z-40 flex h-16 shrink-0 items-center gap-x-4 border-b border-slate-900/5 bg-white/80 backdrop-blur-md px-4 sm:gap-x-6 sm:px-6 lg:px-10">
    <button @click="sideBar = ! sideBar" type="button"
            class="-m-2.5 p-2.5 text-slate-500 hover:text-slate-700 transition-colors lg:hidden">
        <span class="sr-only">Open sidebar</span>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path>
        </svg>
    </button>

    <div class="h-6 w-px bg-slate-900/10 lg:hidden" aria-hidden="true"></div>

    <div class="flex flex-1 items-center justify-end gap-x-4 lg:gap-x-6">

        <!-- Profile dropdown -->
        <div class="relative" x-data="{ isOpen: false }">
            <button @click="isOpen = ! isOpen" type="button"
                    class="flex items-center gap-x-2.5 rounded-full py-1 pl-1 pr-2.5 hover:bg-slate-100 transition-colors"
                    id="user-menu-button"
                    aria-expanded="false" aria-haspopup="true">
                <span class="sr-only">Open user menu</span>
                <span class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-600 text-sm font-semibold text-white shadow-sm ring-2 ring-white">
                    {{ request.user.member.full_name|slice:":1"|upper }}
                </span>
                <span class="hidden lg:flex lg:items-center">
                    <span class="text-sm font-medium leading-6 text-slate-700"
                          aria-hidden="true">{{ request.user.member.full_name }}</span>
                    <svg class="ml-1.5 h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor"
                         aria-hidden="true">
                        <path fill-rule="evenodd"
                              d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                              clip-rule="evenodd"></path>
                    </svg>
                </span>
            </button>

            <div x-show="isOpen"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="transform opacity-100 scale-100"
                 x-transition:leave-end="transform opacity-0 scale-95"
                 @click.away="isOpen = false"
                 @keydown.escape.window="isOpen = false"
                 style="display: none;"
                 class="absolute right-0 z-10 mt-2 w-64 origin-top-right overflow-hidden rounded-2xl bg-white shadow-lifted ring-1 ring-slate-900/5 focus:outline-none"
                 role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button"
                 tabindex="-1">
                <div class="border-b border-slate-100 px-4 py-3.5">
                    <p class="truncate text-sm font-semibold text-slate-900">{{ request.user.member.full_name }}</p>
                    <div class="mt-1 flex items-center gap-x-1.5 text-xs text-slate-500">
                        <svg class="h-3.5 w-3.5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24"
                             stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418"></path>
                        </svg>
                        <span class="truncate">{{ member.timezone }}</span>
                    </div>
                </div>
                <div class="p-1.5">
                    <a href="{% url 'console:settings:profile' %}"
                       class="flex items-center gap-x-2.5 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors"
                       role="menuitem"
                       tabindex="-1" id="user-menu-item-0">
                        <svg class="h-5 w-5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24"
                             stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
                        </svg>
                        Profile settings
                    </a>
                    <form id="logout-form" method="post" action="{% url 'console:auth:logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="flex w-full cursor-pointer items-center gap-x-2.5 rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors"
                                role="menuitem">
                            <svg class="h-5 w-5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24"
                                 stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"></path>
                            </svg>
                            Sign out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('headerNav', () => ({
            isOpenMobile: false,

            async signOut() {
                this.loading = true;

                let url = "/logout";

                let response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                }).then(async (response) => {
                    Alpine.store('showLoading').toggle();
                    if (response.ok) {
                        return response.json();
                    }
                }).then((json) => {
                    window.location.href = "/login"
                }).catch((error) => {
                    Alpine.store('notifications').items.push({
                        show: true,
                        error: true,
                        heading: 'Error!',
                        details: error.message
                    });
                });
            },

        }));
    });
</script>
