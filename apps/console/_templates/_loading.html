<div x-data>
    <div aria-live="assertive"
         class="pointer-events-none fixed inset-x-0 top-0 z-[70] flex flex-col items-center px-4 py-4 sm:items-end sm:px-6 sm:py-6">
        <template x-if="$store.showLoading?.on">
            <div
                    x-transition:enter="transform ease-out duration-300 transition"
                    x-transition:enter-start="translate-y-2 opacity-0 sm:translate-y-0 sm:translate-x-2"
                    x-transition:enter-end="translate-y-0 opacity-100 sm:translate-x-0"
                    x-transition:leave="transition ease-in duration-100"
                    x-transition:leave-start="opacity-100"
                    x-transition:leave-end="opacity-0"
                    class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-lifted ring-1 ring-slate-900/5">
                <div class="p-4">
                    <div class="flex items-center">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-indigo-50 ring-1 ring-inset ring-indigo-600/10">
                            <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                        <div class="ml-3 w-0 flex-1">
                            <p class="text-sm font-semibold text-slate-900" x-text="$store.showLoading.heading">Request In-Progress</p>
                            <p class="mt-0.5 text-sm text-slate-500" x-text="$store.showLoading.message"></p>
                        </div>
                        <div class="ml-4 shrink-0 flex">
                            <button @click="$store.showLoading.toggle();" type="button"
                                    class="inline-flex rounded-md p-1 text-slate-400 hover:bg-slate-50 hover:text-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                                <span class="sr-only">Close</span>
                                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd"
                                          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                          clip-rule="evenodd"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('showLoading', {
            on: false,
            heading: "Loading...",
            message: "Don't refresh page.",
            toggle(message, heading) {
                this.on = !this.on;
                if (heading) {
                    this.heading = heading;
                } else {
                    this.heading = "Loading...";
                }
                if (message) {
                    this.message = message;
                } else {
                    this.heading = "Don't refresh page.";
                }
            }
        });
    });
</script>
