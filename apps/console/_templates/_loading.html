<div x-data>
    <div aria-live="assertive" class="pointer-events-none fixed inset-x-0 top-0 z-[60] flex flex-col items-center gap-3 px-4 py-4 sm:items-end sm:px-6">
        <template x-if="$store.showLoading?.on">
            <div
                x-transition:enter="transform ease-out duration-300 transition"
                x-transition:enter-start="translate-y-2 opacity-0 sm:translate-y-0 sm:translate-x-2"
                x-transition:enter-end="translate-y-0 opacity-100 sm:translate-x-0"
                x-transition:leave="transition ease-in duration-100"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg"
            >
                <div class="p-4">
                    <div class="flex items-center gap-3">
                        <div class="flex-none">
                            <svg class="h-5 w-5 animate-spin text-indigo-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold text-slate-900" x-text="$store.showLoading.heading">Loading...</p>
                            <p class="mt-0.5 text-sm text-slate-500" x-text="$store.showLoading.message"></p>
                        </div>
                        <div class="flex-none">
                            <button
                                type="button"
                                @click="$store.showLoading.toggle();"
                                class="inline-flex rounded-lg p-1 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                                aria-label="Dismiss loading indicator"
                            >
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('showLoading', {
            on: false,
            heading: "Loading...",
            message: "Don't refresh page.",
            toggle(message, heading) {
                this.on = !this.on;
                if (heading) {
                    this.heading = heading;
                } else {
                    this.heading = "Loading...";
                }
                if (message) {
                    this.message = message;
                } else {
                    this.message = "Don't refresh page.";
                }
            }
        });
    });
</script>
