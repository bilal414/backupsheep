<div x-data>
    <div aria-live="assertive"
         class="pointer-events-none fixed inset-x-0 top-0 z-[70] flex flex-col items-center gap-y-3 px-4 py-4 sm:items-end sm:px-6 sm:py-6">
        <template x-for="item in $store.notifications?.items">
            <div x-transition:enter="transform ease-out duration-300 transition"
                 x-transition:enter-start="translate-y-2 opacity-0 sm:translate-y-0 sm:translate-x-2"
                 x-transition:enter-end="translate-y-0 opacity-100 sm:translate-x-0"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 x-show="item.show" x-effect="setTimeout(() => $store.notifications.remove(item), 10000)"
                 class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-lifted ring-1 ring-slate-900/5">
                <div class="p-4">
                    <div class="flex items-start">
                        <div class="shrink-0">
                            <svg x-show="item.success" class="h-6 w-6 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
                            </svg>
                            <svg x-show="item.error" class="h-6 w-6 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"></path>
                            </svg>
                        </div>
                        <div class="ml-3 w-0 flex-1 pt-0.5">
                            <p class="text-sm font-semibold text-slate-900" x-text="item.heading"></p>
                            <p class="mt-1 text-sm text-slate-500" x-text="item.details"></p>
                        </div>
                        <div class="ml-4 shrink-0 flex">
                            <button @click="$store.notifications.remove(item);" type="button"
                                    class="inline-flex rounded-md p-1 text-slate-400 hover:bg-slate-50 hover:text-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                                <span class="sr-only">Close</span>
                                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd"
                                          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                          clip-rule="evenodd"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('notifications', {
            items: [],
            remove(item) {
                item.show = false;
                {#const itemIndex = this.items.indexOf(item);#}
                {#this.items.splice(itemIndex, 1);#}
            }
        });
    });
</script>
