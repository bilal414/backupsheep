<div x-cloak x-show="sideBar" x-transition.opacity @click="sideBar = false" class="bs-shell-v3__scrim lg:hidden" aria-hidden="true"></div>

<aside class="bs-shell-v3__rail" :class="{ 'is-open': sideBar }" aria-label="BackupSheep console navigation">
    <div class="bs-shell-v3__rail-inner">
        <div class="bs-shell-v3__brand">
            <a href="{% url 'console:home:index' %}" class="bs-shell-v3__brand-link">
                <span class="bs-shell-v3__brand-mark" aria-hidden="true">B</span>
                <span class="bs-shell-v3__brand-copy">
                    <strong>BackupSheep</strong>
                    <small>Control plane</small>
                </span>
            </a>
            <button type="button" @click="sideBar = false" class="bs-shell-v3__rail-close lg:hidden" aria-label="Close navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>

        <div class="bs-shell-v3__workspace">
            <span class="bs-shell-v3__workspace-dot" aria-hidden="true"></span>
            <span><strong>Production workspace</strong><small>All systems operational</small></span>
            <span class="bs-shell-v3__workspace-pulse" aria-hidden="true"></span>
        </div>

        {% include "_console_nav.html" %}

        <div class="bs-shell-v3__account">
            <div class="bs-shell-v3__account-avatar">{{ request.user.member.full_name|slice:":1"|upper }}</div>
            <div class="bs-shell-v3__account-copy">
                <strong>{{ request.user.member.full_name }}</strong>
                <small>Workspace member</small>
            </div>
            <form id="sidebar-logout-form" method="post" action="{% url 'console:auth:logout' %}">
                {% csrf_token %}
                <button type="submit" aria-label="Sign out" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10 5H6.75A1.75 1.75 0 0 0 5 6.75v10.5A1.75 1.75 0 0 0 6.75 19H10M14 8l4 4-4 4M18 12H9"/></svg>
                </button>
            </form>
        </div>
    </div>
</aside>
