<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title></title>
</head>
<body style="margin:0; padding:0; width:100%; -webkit-text-size-adjust:none; background-color:#f1f5f9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f1f5f9" style="width:100%; margin:0; padding:0; background-color:#f1f5f9;">
        <tr>
            <td align="center" style="padding:24px 16px 40px;">
                <!-- Brand header -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin:0 0 24px;">
                    <tr>
                        <td align="center" style="padding:8px 0;">
                            <a href="{{ site_app_url|default:'#' }}" target="_blank" style="font-family:'Inter',Arial,Helvetica,sans-serif; font-size:20px; font-weight:700; line-height:28px; letter-spacing:-0.02em; color:#4f46e5; text-decoration:none;">{{ site_app_name|default:"BackupSheep" }}</a>
                        </td>
                    </tr>
                </table>
                <!-- Content card (max 600px; fixed width for Outlook via ghost table) -->
                <!--[if mso]>
                <table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td>
                <![endif]-->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%; max-width:600px; margin:0 auto; background-color:#ffffff; border:1px solid #e2e8f0; border-radius:8px;">
                    <tr>
                        <td style="padding:32px 24px; font-family:'Inter',Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#475569;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                </table>
                <!--[if mso]>
                </td></tr></table>
                <![endif]-->
                <!-- Footer -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin:24px 0 0;">
                    <tr>
                        <td align="center" style="padding:8px 0; font-family:'Inter',Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#94a3b8;">
                            &copy; {{ site_app_name|default:"BackupSheep" }}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
