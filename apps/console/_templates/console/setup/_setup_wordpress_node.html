<div x-data="setupWordPressNode()">
    <section class="max-w-2xl rounded-xl border border-slate-200 bg-white shadow-sm" aria-labelledby="wordpress-config-heading">
        <div class="border-b border-slate-200 px-5 py-4">
            <div class="flex items-center gap-3">
                <span class="grid h-9 w-9 flex-none place-items-center rounded-lg bg-indigo-50 text-indigo-600">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378.138-.75.43-.99l1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </span>
                <div class="min-w-0">
                    <h2 id="wordpress-config-heading" class="text-sm font-semibold text-slate-900">Node configuration</h2>
                    <p class="mt-0.5 text-xs text-slate-500">Name this node and choose what each WordPress backup includes.</p>
                </div>
            </div>
        </div>
        <div class="space-y-5 p-5">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700">Name</label>
                <input x-model="wordpress.name" type="text" name="name" id="name" autocomplete="name"
                       class="mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20">
                <p x-show="wordpressErrors?.name" class="mt-1.5 text-xs font-medium text-red-600" id="name-error"
                   x-text="wordpressErrors?.name"></p>
            </div>
            <div>
                <label for="include" class="block text-sm font-medium text-slate-700">What should be included in the backup?</label>
                <div class="relative mt-1.5">
                    <button @click="toggleIncludeDropdown()"
                            type="button"
                            class="relative w-full cursor-default rounded-lg border border-slate-300 bg-white py-2 pl-3 pr-10 text-left text-sm text-slate-900 shadow-sm focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20"
                            aria-haspopup="listbox" :aria-expanded="openInclude" aria-labelledby="listbox-label">
                        <span class="block truncate" x-text="wordpress.include?.name||'--Select--'"></span>
                        <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"/>
                            </svg>
                        </span>
                    </button>

                    <ul x-cloak
                        x-show="openInclude"
                        @click.self="toggleIncludeDropdown()"
                        @click.away="openInclude = false"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0"
                        x-transition:enter-end="opacity-100"
                        x-transition:leave="transition ease-in duration-100"
                        x-transition:leave-start="opacity-100"
                        x-transition:leave-end="opacity-0"
                        class="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-xl border border-slate-200 bg-white py-1.5 text-sm shadow-lg focus:outline-none"
                        tabindex="-1"
                        role="listbox"
                        aria-labelledby="listbox-label" aria-activedescendant="listbox-option-3">

                        <template x-for="(include, index) in wordPressIncludes">
                            <li @click="wordpress.include = include;toggleIncludeDropdown()"
                                @mouseenter="includeActiveIndex = include.id"
                                @mouseleave="includeActiveIndex = null"
                                :class="{ 'text-white bg-indigo-600': includeActiveIndex === include.id, 'text-slate-700': !(includeActiveIndex === include.id) }"
                                class="relative cursor-default select-none py-2 pl-9 pr-4"
                                id="listbox-option-0" role="option">
                                <span class="block truncate font-normal">
                                    <span x-text="include.name"></span>
                                </span>
                                <span x-show="wordpress.include?.id === include.id"
                                      :class="{ 'text-indigo-600': (wordpress.include?.id === include.id) && (includeActiveIndex !== include.id), 'text-white': (!(wordpress.include?.id === include.id) || (includeActiveIndex === include.id)) }"
                                      class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-indigo-600">
                                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                                    </svg>
                                </span>
                            </li>
                        </template>
                    </ul>
                </div>
                <p x-show="wordpressErrors?.include" class="mt-1.5 text-xs font-medium text-red-600"
                   id="region-error" x-text="wordpressErrors?.include"></p>
            </div>
            <div>
                <label for="notes" class="block text-sm font-medium text-slate-700">Notes</label>
                <textarea x-model="wordpress.notes" id="notes" name="notes" rows="3"
                          class="mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20"></textarea>
                <p x-show="wordpressErrors?.notes" class="mt-1.5 text-xs font-medium text-red-600" id="notes-error"
                   x-text="wordpressErrors?.notes"></p>
            </div>
        </div>
        <div class="border-t border-slate-200 px-5 py-4">
            <button @click="saveWordPress()" type="button"
                    class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-60">
                {% if not node.id %}
                    <span>Create New Node</span>
                {% elif node.id %}
                    <span>Save Node Changes</span>
                {% endif %}
            </button>
        </div>
    </section>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('setupWordPressNode', () => ({
            loading: true,
            error: null,
            errorObjectList: null,
            objectList: null,
            wordPressIncludes: [
                {id: 1, name: "Full (Database + Files)"},
                {id: 2, name: "Only Database"},
                {id: 3, name: "Only Files"}
            ],
            wordpress: {},
            wordpressErrors: {},
            integration_code: "{{integration.code}}",
            connection_id: "{{connection.id}}",
            location_id: "{{connection.location.id}}",
            object_type: "{{object_code}}",

            openInclude: false,
            includeActiveIndex: false,

            init() {
                this.loading = true;
                this.getWordPress();
            },

            openUrl(url) {
                window.location.href = url;
            },

            toggleIncludeDropdown() {
                this.openInclude = !this.openInclude;
                this.includeActiveIndex = null;
            },

            async saveWordPress() {
                Alpine.store('showLoading').toggle();

                let url = "";
                let method = "";

                let data = {
                    node: {
                        connection: this.connection_id,
                        name: this.wordpress.name,
                    },
                    location: this.location_id,
                    name: this.wordpress.name,
                    include: this.wordpress.include ? this.wordpress.include.id : 1,
                    notes: this.wordpress.notes
                };

                if (this.wordpress.id) {
                    url = "/api/v1/saas/" + this.integration_code + "/" + this.wordpress.id + "/";
                    method = "PATCH";
                } else {
                    url = "/api/v1/saas/" + this.integration_code + "/";
                    method = "POST";
                }

                let response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    method: method,
                    body: JSON.stringify(data)
                }).then(async (response) => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        this.loading = false;
                        let json;
                        try {
                            json = await response.json();
                        } catch (exception_var) {
                            json = {detail: response.status + " - " + response.statusText + ". Please contact support."};
                        }

                        this.wordpressErrors = json;
                        throw new Error(json.detail);
                    }
                }).then((json) => {
                    Alpine.store('notifications').items.push({
                        show: true,
                        success: true,
                        heading: 'Node successfully linked.',
                        details: json.detail
                    });
                    Alpine.store('showLoading').toggle();
                    if (this.wordpress.id) {
                        window.location.reload();
                    } else {
                        window.location.href = "/console/nodes/" + json.node.id;
                    }
                }).catch((error) => {
                    Alpine.store('notifications').items.push({
                        show: true,
                        error: true,
                        heading: 'Error!',
                        details: error.message
                    });
                    this.error = error;
                    Alpine.store('showLoading').toggle();
                });
            },

            async getWordPress() {
                let params = {}

                let url = "/api/v1/saas/" + this.integration_code + "/" + "{{node.wordpress.id}}" + "/?" + new URLSearchParams(params);

                let response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    method: 'GET',
                }).then(async (response) => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        let json;
                        try {
                            json = await response.json();
                        } catch (exception_var) {
                            json = {detail: response.status + " - " + response.statusText + ". Please contact support."};
                        }

                        this.wordpressErrors = json;
                        throw new Error(json.detail);
                    }
                }).then((json) => {
                    this.wordpress = json;
                    if (this.wordpress.include) {
                        this.wordpress.include = this.wordPressIncludes.find(({id}) => id === this.wordpress.include);
                    } else {
                        this.wordpress.include = this.wordPressIncludes.find(({id}) => id === 1);
                    }
                }).catch((error) => {
                    this.error = error;
                });
            },

        }));
    });
</script>
