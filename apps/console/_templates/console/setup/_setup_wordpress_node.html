<div x-data="setupWordPressNode()">
    <div class="grid grid-cols-1 gap-6">
        <div class="overflow-hidden rounded-2xl bg-white ring-1 ring-slate-900/5 shadow-soft">
            <div class="border-b border-slate-100 px-5 py-4 sm:px-6">
                <div class="flex items-center gap-x-3">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </span>
                    <div>
                        <h3 class="text-sm font-semibold text-slate-900">Node Configuration</h3>
                        <p class="mt-0.5 text-sm text-slate-500">Name this node and choose what should be included in
                            the backup.</p>
                    </div>
                </div>
            </div>
            <div class="px-5 py-6 sm:px-6">
                <div class="grid grid-cols-1 gap-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700">
                            Name
                        </label>
                        <div class="mt-1.5">
                            <input x-model="wordpress.name" type="text" name="name" id="name" autocomplete="name"
                                   class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <p x-show="wordpressErrors?.name" class="mt-1.5 text-sm text-rose-600" id="name-error"
                               x-text="wordpressErrors?.name"></p>
                        </div>
                    </div>
                    <div>
                        <label for="include" class="block text-sm font-medium text-slate-700">
                            What should be included in the backup?
                        </label>
                        <div class="relative mt-1.5" @click.outside="openInclude = false">
                            <button @click="toggleIncludeDropdown()"
                                    type="button"
                                    class="relative w-full cursor-default rounded-lg bg-white py-2.5 pl-3 pr-10 text-left text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:text-sm"
                                    aria-haspopup="listbox" aria-expanded="true" aria-labelledby="listbox-label">
                                <span class="block truncate"
                                      x-text="wordpress.include?.name||'--Select--'"></span>
                                <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
                                    <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg"
                                         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                         aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"></path>
                                    </svg>
                                </span>
                            </button>

                            <ul
                                    x-show="openInclude"
                                    @click.self="toggleIncludeDropdown()"
                                    x-transition:enter=""
                                    x-transition:enter-start=""
                                    x-transition:enter-end=""
                                    x-transition:leave="transition ease-in duration-100"
                                    x-transition:leave-start="opacity-100"
                                    x-transition:leave-end="opacity-0"
                                    class="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-xl bg-white py-1 text-base shadow-lg ring-1 ring-slate-900/5 focus:outline-none sm:text-sm"
                                    tabindex="-1"
                                    role="listbox"
                                    aria-labelledby="listbox-label" aria-activedescendant="listbox-option-3">

                                <template x-for="(include, index) in wordPressIncludes">
                                    <li
                                            @click="wordpress.include = include;toggleIncludeDropdown()"
                                            @mouseenter="includeActiveIndex = include.id"
                                            @mouseleave="includeActiveIndex = null"
                                            :class="{ 'text-white bg-indigo-600': includeActiveIndex === include.id, 'text-slate-700': !(includeActiveIndex === include.id) }"
                                            class="relative cursor-default select-none py-2.5 pl-9 pr-4"
                                            id="listbox-option-0" role="option">
                                            <span class="block truncate font-normal">
                                                <span x-text="include.name"></span>
                                            </span>

                                        <span
                                                x-show="wordpress.include?.id === include.id"
                                                :class="{ 'text-indigo-600': (wordpress.include?.id === include.id) && (includeActiveIndex !== include.id), 'text-white': (!(wordpress.include?.id === include.id) || (includeActiveIndex === include.id)) }"
                                                class="absolute inset-y-0 left-0 flex items-center pl-2 text-indigo-600">
                                              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                                                   viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                                <path fill-rule="evenodd"
                                                      d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                                      clip-rule="evenodd"></path>
                                              </svg>
                                            </span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                        <p x-show="wordpressErrors?.include" class="mt-1.5 text-sm text-rose-600"
                           id="region-error" x-text="wordpressErrors?.include"></p>
                    </div>

                    <div>
                        <label for="notes" class="block text-sm font-medium text-slate-700">
                            Notes
                        </label>
                        <div class="mt-1.5">
                            <textarea x-model="wordpress.notes" id="notes" name="notes" rows="3"
                                      class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                            <p x-show="wordpressErrors?.notes" class="mt-1.5 text-sm text-rose-600" id="notes-error"
                               x-text="wordpressErrors?.notes"></p>
                        </div>
                    </div>
                </div>

                <button @click="saveWordPress()" type="button"
                        class="mt-6 inline-flex w-full items-center justify-center gap-x-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition-colors">
                    {% if not node.id %}
                        <span>Create New Node</span>
                    {% elif node.id %}
                        <span>Save Node Changes</span>
                    {% endif %}
                </button>
            </div>
            <div class="sm:col-span-1 mb-3" x-show="!errorObjectList">

            </div>
        </div>
        {#x-show="wordpress.paths.length>0 && !wordpress.all_paths"#}
    </div>
</div>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('setupWordPressNode', () => ({
            loading: true,
            error: null,
            errorObjectList: null,
            objectList: null,
            wordPressIncludes: [
                {id: 1, name: "Full (Database + Files)"},
                {id: 2, name: "Only Database"},
                {id: 3, name: "Only Files"}
            ],
            wordpress: {},
            wordpressErrors: {},
            integration_code: "{{integration.code}}",
            connection_id: "{{connection.id}}",
            location_id: "{{connection.location.id}}",
            object_type: "{{object_code}}",

            openInclude: false,
            includeActiveIndex: false,

            init() {
                this.loading = true;
                this.getWordPress();
            },

            openUrl(url) {
                window.location.href = url;
            },

            toggleIncludeDropdown() {
                this.openInclude = !this.openInclude;
                this.includeActiveIndex = null;
            },

            async saveWordPress() {
                Alpine.store('showLoading').toggle();

                let url = "";
                let method = "";

                let data = {
                    node: {
                        connection: this.connection_id,
                        name: this.wordpress.name,
                    },
                    location: this.location_id,
                    name: this.wordpress.name,
                    include: this.wordpress.include ? this.wordpress.include.id : 1,
                    notes: this.wordpress.notes
                };

                if (this.wordpress.id) {
                    url = "/api/v1/saas/" + this.integration_code + "/" + this.wordpress.id + "/";
                    method = "PATCH";
                } else {
                    url = "/api/v1/saas/" + this.integration_code + "/";
                    method = "POST";
                }

                let response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    method: method,
                    body: JSON.stringify(data)
                }).then(async (response) => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        this.loading = false;
                        let json;
                        try {
                            json = await response.json();
                        } catch (exception_var) {
                            json = {detail: response.status + " - " + response.statusText + ". Please contact support."};
                        }

                        this.wordpressErrors = json;
                        throw new Error(json.detail);
                    }
                }).then((json) => {
                    Alpine.store('notifications').items.push({
                        show: true,
                        success: true,
                        heading: 'Node successfully linked.',
                        details: json.detail
                    });
                    Alpine.store('showLoading').toggle();
                    if (this.wordpress.id) {
                        window.location.reload();
                    } else {
                        window.location.href = "/console/nodes/" + json.node.id;
                    }
                }).catch((error) => {
                    Alpine.store('notifications').items.push({
                        show: true,
                        error: true,
                        heading: 'Error!',
                        details: error.message
                    });
                    this.error = error;
                    Alpine.store('showLoading').toggle();
                });
            },

            async getWordPress() {
                let params = {}

                let url = "/api/v1/saas/" + this.integration_code + "/" + "{{node.wordpress.id}}" + "/?" + new URLSearchParams(params);

                let response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    method: 'GET',
                }).then(async (response) => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        let json;
                        try {
                            json = await response.json();
                        } catch (exception_var) {
                            json = {detail: response.status + " - " + response.statusText + ". Please contact support."};
                        }

                        this.wordpressErrors = json;
                        throw new Error(json.detail);
                    }
                }).then((json) => {
                    this.wordpress = json;
                    if (this.wordpress.include) {
                        this.wordpress.include = this.wordPressIncludes.find(({id}) => id === this.wordpress.include);
                    } else {
                        this.wordpress.include = this.wordPressIncludes.find(({id}) => id === 1);
                    }
                }).catch((error) => {
                    this.error = error;
                });
            },

        }));
    });
</script>
