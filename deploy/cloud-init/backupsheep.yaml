#cloud-config
#
# BackupSheep intentionally ships no unattended root cloud-init installer.
#
# Host provisioning is the operator's security boundary: install and configure Git,
# Docker Engine >= 28.0.0, Docker Compose >= 2.33.1, firewall/TLS/monitoring, and the
# Docker-authorized application user using the host's own policy. Then use the verified
# exact-commit workflow in docs/guides/installation.md as that user.
#
# This inert file replaces the former mutable-main, root-executed download. It is kept as
# an explicit compatibility marker so existing automation fails visibly instead of
# silently acquiring and executing a changing script with host privileges.
runcmd: []
