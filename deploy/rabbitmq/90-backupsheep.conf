# BackupSheep's longest external command budget is 23 hours. Keep RabbitMQ's
# delivery acknowledgement protection enabled, but allow a two-hour margin so a
# legitimate late-ack task cannot close the worker consumer before it returns.
consumer_timeout = 90000000

# The root-owned entrypoint writes a hash-only bootstrap definition into this bounded
# tmpfs. The long-running server imports the reviewed vhost/topology without receiving
# any application or worker credential and never exposes a plaintext password in env.
definitions.import_backend = local_filesystem
definitions.local.path = /run/backupsheep-rabbitmq/definitions.json
