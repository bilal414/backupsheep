# BackupSheep's longest external command budget is 23 hours. Keep RabbitMQ's
# delivery acknowledgement protection enabled, but allow a two-hour margin so a
# legitimate late-ack task cannot close the worker consumer before it returns.
consumer_timeout = 90000000

# The application service account needs AMQP permissions on its own vhost, not management
# administrator privileges. This setting applies only when a fresh broker database creates
# RABBITMQ_DEFAULT_USER; existing-volume migrations create an untagged user explicitly.
default_user_tags.administrator = false
