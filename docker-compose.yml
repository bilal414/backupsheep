# Self-hosted BackupSheep stack. One image (built once from Dockerfile) runs as several
# services so heavy backups can't starve the web UI and each workload scales on its own.
# Queue routing lives in settings.py (CELERY_TASK_ROUTES).
#
#   migrate ......... one-shot: applies DB migrations, then exits
#   app ............. gunicorn web server (port 8000, static via WhiteNoise)
#   worker-cloud .... API-only provider snapshots (DigitalOcean, Hetzner, AWS, …) plus
#                     general default-queue tasks. Stateless.
#   worker-database . database dumps (pg_dump/mysqldump). Heavy CPU/disk.
#   worker-files .... website/basecamp dumps. Heavy CPU/disk.
#   worker-storage .. uploads each finished dump to the storage backends + cleanup.
#                     Recreate its exact namespace pair when changing scale:
#                         ./backupsheep-compose --profile operations up --detach --no-deps --force-recreate --scale worker-storage=4 storage-egress-guard worker-storage
#   worker-logs ..... DB log entries, Slack/Telegram/Firebase notifications, and pruning
#                     old run logs from each source lane's private workdir.
#   beat ............ Celery beat scheduler. BackupSheep scheduled-backup entries use a
#                     transactional occurrence claim, so duplicate Beat processes
#                     converge safely; keep ordinary maintenance entries singleton.
#
# A profile-less `./backupsheep-compose up` is accepted only for a fresh project before
# any guarded workload exists. Normal installation and recovery must use install.sh,
# which sequences migrations and recreates every guard/workload namespace pair.
# Use `./backupsheep-compose config --quiet` for non-mutating model validation.
#
# Database, files, and storage use distinct UID-owned private work volumes. Their only
# shared paths carry authenticated BSE1 ciphertext through fenced, read-only handoffs.
# The legacy backup_workdir is mounted only into the witnessed one-shot provisioner so
# an upgrade cannot silently expose historical plaintext to another lane.
#
# Plus PostgreSQL, RabbitMQ (the Celery broker), and a no-secret egress guard image.
# Build all reviewed local images,
# then use the installer for sequenced startup. For a fresh disposable project only,
# the model-locking wrapper also accepts:
#     ./backupsheep-compose build db app app-egress-guard rabbitmq
#     ./backupsheep-compose up --detach
#
# Configure .env (see .env_sample). For this stack use the service names below:
#     DB_HOST=db
#     DB_PORT=5432
#     RABBITMQ_HOST=rabbitmq
#     RABBITMQ_USER=backupsheep_app
#     RABBITMQ_VHOST=backupsheep
# The installer stores the Django, database, broker, and onboarding secrets as private
# file-backed Compose secrets under `.secrets`; their `.env` counterparts stay blank.
# PostgreSQL has a database-only bootstrap superuser, a one-shot schema-owning
# migrator, and an independently authenticated non-owner identity for every runtime
# lane. A post-migration seal applies and witnesses the exact table/column/RLS policy.

# Persist the installer-reviewed project identity in configuration as well as the
# command line. This prevents a manual rerun from silently selecting a new project
# name and creating an apparently empty second database/broker volume set.
name: "${BACKUPSHEEP_COMPOSE_PROJECT_NAME:?BACKUPSHEEP_COMPOSE_PROJECT_NAME is required}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# A random installer-owned identity is attached to every service container and one
# empty sentinel volume. The installer combines it with Compose's standard labels
# before mutation, without changing labels on existing data volumes during upgrades.
x-installation-labels: &installation-labels
  com.backupsheep.installation-id: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"

# Only the no-secret policy guard receives network administration. It has no env_file,
# application secret, or data mount, becomes UID/GID 10020, drops every capability
# except NET_ADMIN, and reconciles exact Docker-DNS peer sets in place. Allowlist mode
# adds a loopback-only exact-name DNS proxy as separate zero-capability UID/GID 10021.
x-egress-guard-runtime: &egress-guard-runtime
  labels: *installation-labels
  image: "${BACKUPSHEEP_EGRESS_IMAGE:-backupsheep-egress:local}"
  pull_policy: never
  user: "0:0"
  privileged: false
  read_only: true
  init: false
  cgroup: private
  ipc: private
  pids_limit: 32
  mem_limit: 64m
  memswap_limit: 64m
  mem_swappiness: 0
  cpus: "0.25"
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - NET_ADMIN
    - SETUID
    - SETGID
    - SETPCAP
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /run/backupsheep-egress:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=0,gid=0
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 128
      hard: 128
  healthcheck:
    test: ["CMD", "/usr/local/bin/backupsheep-egress-healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  logging: *default-logging
  # A restarted guard would enter a new network namespace while a running
  # workload remained in the old one. Recovery must force-recreate the exact
  # guard/workload pair through backupsheep-compose.
  restart: "no"

x-egress-workload-healthcheck: &egress-workload-healthcheck
  test: ["CMD", "/usr/local/bin/backupsheep-egress-workload-healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 2
  start_period: 60s

# Least-privilege defaults for services built from the BackupSheep application image.
# The explicit UID is defense in depth if an image's USER metadata regresses. The root
# filesystem is immutable; only the named data volumes and bounded tmpfs are writable.
x-app-runtime: &app-runtime
  labels: *installation-labels
  user: "10001:10001"
  # Never substitute an untrusted registry image when the reviewed local build is
  # absent. The installer builds the exact commit before it starts any service.
  pull_policy: never
  privileged: false
  read_only: true
  init: true
  cgroup: private
  ipc: private
  pids_limit: "${BACKUPSHEEP_PIDS_LIMIT:-512}"
  mem_swappiness: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
    - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 4096
      hard: 4096
  stop_grace_period: "${BACKUPSHEEP_STOP_GRACE_PERIOD:-5m}"

