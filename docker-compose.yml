# Self-hosted BackupSheep stack. One image (built once from Dockerfile) runs as several
# services so heavy backups can't starve the web UI and each workload scales on its own.
# Queue routing lives in settings.py (CELERY_TASK_ROUTES).
#
#   migrate ......... one-shot: applies DB migrations, then exits
#   app ............. gunicorn web server (port 8000, static via WhiteNoise)
#   worker-cloud .... API-only provider snapshots (DigitalOcean, Hetzner, AWS, …) plus
#                     general default-queue tasks. Stateless.
#   worker-database . database dumps (pg_dump/mysqldump). Heavy CPU/disk.
#   worker-files .... website/wordpress/basecamp dumps. Heavy CPU/disk.
#   worker-storage .. uploads each finished dump to the storage backends + cleanup.
#                     Scale this out for upload throughput:
#                         ./backupsheep-compose --profile operations up -d --scale worker-storage=4
#   worker-logs ..... DB log entries, Slack/Telegram/Firebase notifications, and pruning
#                     old run logs from disk (delete_old_logs).
#   beat ............ Celery beat scheduler. BackupSheep scheduled-backup entries use a
#                     transactional occurrence claim, so duplicate Beat processes
#                     converge safely; keep ordinary maintenance entries singleton.
#
# A profile-less `./backupsheep-compose up` is provider-operation-disabled/core-only: it
# creates or restarts PostgreSQL, RabbitMQ and the web UI and can apply irreversible
# database migrations. Use `./backupsheep-compose config --quiet` for non-mutating model
# validation. Provider workers and Beat require the explicit `operations` profile after
# credentials and recovery state have been reviewed:
#     ./backupsheep-compose --profile operations up -d
#
# Database, files, and storage use distinct UID-owned private work volumes. Their only
# shared paths carry authenticated BSE1 ciphertext through fenced, read-only handoffs.
# The legacy backup_workdir is mounted only into the witnessed one-shot provisioner so
# an upgrade cannot silently expose historical plaintext to another lane.
#
# Plus PostgreSQL, RabbitMQ (the Celery broker), and a no-secret egress guard image.
# Build all reviewed local images,
# then start the core with the model-locking wrapper:
#     ./backupsheep-compose build db app app-egress-guard
#     ./backupsheep-compose up -d
#
# Configure .env (see .env_sample). For this stack use the service names below:
#     DB_HOST=db
#     DB_PORT=5432
#     RABBITMQ_HOST=rabbitmq
#     RABBITMQ_USER=backupsheep_app
#     RABBITMQ_VHOST=backupsheep
# The installer stores the Django, database, broker, and onboarding secrets as private
# file-backed Compose secrets under `.secrets`; their `.env` counterparts stay blank.
# PostgreSQL has three distinct trust levels: a database-only bootstrap superuser, a
# one-shot schema-owning migrator, and the non-owner application runtime identity.

# Persist the installer-reviewed project identity in configuration as well as the
# command line. This prevents a manual rerun from silently selecting a new project
# name and creating an apparently empty second database/broker volume set.
name: "${BACKUPSHEEP_COMPOSE_PROJECT_NAME:?BACKUPSHEEP_COMPOSE_PROJECT_NAME is required}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# A random installer-owned identity is attached to every service container and one
# empty sentinel volume. The installer combines it with Compose's standard labels
# before mutation, without changing labels on existing data volumes during upgrades.
x-installation-labels: &installation-labels
  com.backupsheep.installation-id: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"

# Only a short policy bootstrap receives network administration capability. It has no
# env_file, application secret, or data mount, then permanently becomes UID/GID 10020
# with an empty capability bounding set while keeping the namespace-local nft policy.
x-egress-guard-runtime: &egress-guard-runtime
  labels: *installation-labels
  image: "${BACKUPSHEEP_EGRESS_IMAGE:-backupsheep-egress:local}"
  pull_policy: never
  user: "0:0"
  privileged: false
  read_only: true
  cgroup: private
  ipc: private
  pids_limit: 32
  mem_limit: 64m
  cpus: "0.25"
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
    - SETUID
    - SETGID
    - SETPCAP
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /run/backupsheep-egress:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=0,gid=0
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 128
      hard: 128
  healthcheck:
    test: ["CMD", "/usr/local/bin/backupsheep-egress-healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  logging: *default-logging
  restart: unless-stopped

# Least-privilege defaults for services built from the BackupSheep application image.
# The explicit UID is defense in depth if an image's USER metadata regresses. The root
# filesystem is immutable; only the named data volumes and bounded tmpfs are writable.
x-app-runtime: &app-runtime
  labels: *installation-labels
  user: "10001:10001"
  # Never substitute an untrusted registry image when the reviewed local build is
  # absent. The installer builds the exact commit before it starts any service.
  pull_policy: never
  privileged: false
  read_only: true
  init: true
  cgroup: private
  ipc: private
  pids_limit: "${BACKUPSHEEP_PIDS_LIMIT:-512}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
    - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 4096
      hard: 4096
  stop_grace_period: "${BACKUPSHEEP_STOP_GRACE_PERIOD:-5m}"

# `env_file` remains the compatibility/configuration surface, but direct copies of the
# direct installation secrets are explicitly removed from every application container.
# Settings resolves the first three from the read-only secret files instead. Only the
# web service receives the onboarding token secret.
x-app-secret-environment: &app-secret-environment
  # `env_file` is evaluated before the image entrypoint. Blank loader hooks here so
  # a stale/tampered .env cannot inject a shared library before init.sh can sanitize
  # its descendants or capture TLS session keys.
  LD_AUDIT: ""
  LD_LIBRARY_PATH: ""
  LD_PRELOAD: ""
  SSLKEYLOGFILE: ""
  # The stock image also supports a JSON configuration blob for non-Compose PaaS
  # deployments. Suppress that alternate source here so it cannot replace the
  # reviewed .env plus file-backed secret model. Pin the only settings module whose
  # deployment preflight and hardening contract are reviewed by this stack.
  BACKUPSHEEP_SECRETS: ""
  DJANGO_SETTINGS_MODULE: backupsheep.settings
  DJANGO_SECRET_KEY: ""
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  # URL-style overrides embed credentials and take precedence over the reviewed
  # file-backed fragments in Django/Celery. Blank them even when a legacy .env
  # still contains one; the deployment preflight independently enforces this.
  DATABASE_URL: ""
  DB_PASSWORD: ""
  DB_PASSWORD_FILE: /run/secrets/db_password
  CELERY_BROKER_URL: ""
  RABBITMQ_PASSWORD: ""
  RABBITMQ_PASSWORD_FILE: ""
  # Stock Docker authenticates every Celery publication with a lane-specific
  # Ed25519 key. Consumers receive the public registry, never another lane's key.
  BACKUPSHEEP_CELERY_SECURITY_REQUIRED: "true"
  BACKUPSHEEP_CELERY_SECURITY_GENERATION: "${BACKUPSHEEP_CELERY_SECURITY_GENERATION:?BACKUPSHEEP_CELERY_SECURITY_GENERATION is required}"
  CELERY_SIGNING_PRIVATE_KEY_FILE: ""
  CELERY_TRUSTED_PUBLIC_KEYS_FILE: /run/secrets/celery_trusted_public_keys
  ONBOARDING_INSTALL_TOKEN: ""
  # Keep SSH trust and the optional managed identity out of the shared backup
  # work volume. The web role receives only the public identity/trust store;
  # Compose mounts the managed private key only into database/files workers.
  SSH_KNOWN_HOSTS_PATH: /var/lib/backupsheep/ssh-trust/known_hosts
  SSH_MANAGED_PRIVATE_KEY_PATH: /run/backupsheep/ssh/managed_private_key
  BACKUPSHEEP_SSH_TRUST_GID: "10997"
  # Stock enterprise custody is BSE1-only. Key identifiers and the decrypt allowlist
  # are non-secret configuration. Database/files receive distinct credentials whose
  # IAM policies must condition KMS access on their exact bse:lane context.
  BACKUPSHEEP_ARTIFACT_ENCRYPTION_MODE: bse1
  BACKUPSHEEP_ARTIFACT_ENTERPRISE_MODE: "true"
  BACKUPSHEEP_ARTIFACT_ALLOW_LEGACY_RESTORE: "false"
  BACKUPSHEEP_ARTIFACT_KEY_PROVIDER: aws-kms
  BACKUPSHEEP_ARTIFACT_KMS_KEY_ID: "${BACKUPSHEEP_ARTIFACT_KMS_KEY_ID:?BACKUPSHEEP_ARTIFACT_KMS_KEY_ID is required}"
  BACKUPSHEEP_ARTIFACT_KMS_REGION: "${BACKUPSHEEP_ARTIFACT_KMS_REGION:?BACKUPSHEEP_ARTIFACT_KMS_REGION is required}"
  BACKUPSHEEP_ARTIFACT_KMS_ALLOWED_KEY_ARNS: "${BACKUPSHEEP_ARTIFACT_KMS_ALLOWED_KEY_ARNS:?BACKUPSHEEP_ARTIFACT_KMS_ALLOWED_KEY_ARNS is required}"
  BACKUPSHEEP_ARTIFACT_KMS_ENDPOINT_URL: ""
  BACKUPSHEEP_ARTIFACT_KMS_ALLOW_INSECURE_ENDPOINT: "false"
  BACKUPSHEEP_ARTIFACT_KMS_CONNECT_TIMEOUT_SECONDS: "${BACKUPSHEEP_ARTIFACT_KMS_CONNECT_TIMEOUT_SECONDS:-5}"
  BACKUPSHEEP_ARTIFACT_KMS_READ_TIMEOUT_SECONDS: "${BACKUPSHEEP_ARTIFACT_KMS_READ_TIMEOUT_SECONDS:-20}"
  BACKUPSHEEP_ARTIFACT_KMS_MAX_ATTEMPTS: "${BACKUPSHEEP_ARTIFACT_KMS_MAX_ATTEMPTS:-3}"
  BACKUPSHEEP_PLAINTEXT_ROOT: /code/_storage
  BACKUPSHEEP_DATABASE_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/transfer/database
  BACKUPSHEEP_FILES_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/transfer/files
  BACKUPSHEEP_RESTORE_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/restore-transfer
  BACKUPSHEEP_PRIVATE_MIN_FREE_BYTES: "${BACKUPSHEEP_PRIVATE_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_PRIVATE_MIN_FREE_INODES: "${BACKUPSHEEP_PRIVATE_MIN_FREE_INODES:-1024}"
  BACKUPSHEEP_TRANSFER_MIN_FREE_BYTES: "${BACKUPSHEEP_TRANSFER_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_TRANSFER_MIN_FREE_INODES: "${BACKUPSHEEP_TRANSFER_MIN_FREE_INODES:-1024}"
  BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_BYTES: "${BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_INODES: "${BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_INODES:-1024}"
  # Empty every ambient AWS credential/role/metadata/endpoint source inherited from
  # env_file. Each source lane overrides only AWS_SHARED_CREDENTIALS_FILE below.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  AWS_SECURITY_TOKEN: ""
  AWS_PROFILE: ""
  AWS_DEFAULT_PROFILE: ""
  AWS_CONFIG_FILE: ""
  AWS_CA_BUNDLE: ""
  AWS_METADATA_SERVICE_ENDPOINT: ""
  AWS_METADATA_SERVICE_ENDPOINT_MODE: ""
  BOTO_CONFIG: ""
  AWS_WEB_IDENTITY_TOKEN_FILE: ""
  AWS_ROLE_ARN: ""
  AWS_ROLE_SESSION_NAME: ""
  AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
  AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
  AWS_CONTAINER_AUTHORIZATION_TOKEN: ""
  AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE: ""
  AWS_ENDPOINT_URL: ""
  AWS_ENDPOINT_URL_KMS: ""
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_EC2_METADATA_V1_DISABLED: "true"
  AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: "true"
  AWS_SHARED_CREDENTIALS_FILE: ""

x-app-secrets: &app-secrets
  - django_secret_key
  - db_password
  - celery_trusted_public_keys

# Shared stateful-service controls. PostgreSQL and RabbitMQ start directly as their
# fixed non-root users with an empty capability bounding set. A separate non-networked
# RabbitMQ one-shot proves its already-correct named-volume ownership before startup.
x-stateful-runtime: &stateful-runtime
  labels: *installation-labels
  privileged: false
  read_only: true
  # Do not inject Docker's root-owned init shim here. Both vendor entrypoints
  # exec their long-running server after dropping privileges, so the server can
  # be non-root PID 1 and handle its own documented shutdown path.
  cgroup: private
  ipc: private
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 65536
      hard: 65536

# One externally routed bridge per outward-facing role prevents compromised roles from
# reaching each other on their egress interface. Each outward service assigns that
# bridge `gw_priority: 1` so an internal bridge cannot become its default route.
x-egress-network: &egress-network
  attachable: false
  driver_opts:
    com.docker.network.bridge.enable_icc: "false"

# Every database/broker attachment is a distinct internal bridge. A worker can reach
# only its required stateful endpoints, not another BackupSheep role. The database and
# broker never share a bridge with each other.
x-internal-network: &internal-network
  internal: true
  attachable: false

services:
  db:
    <<: *stateful-runtime
    # Defense in depth with the image USER declaration: never enter the vendor
    # entrypoint's root ownership-repair branch for the stock named volume.
    user: "999:999"
    # Keep the Debian generation aligned with the PostgreSQL 18 image used to
    # initialize existing volumes. Moving a cluster created with glibc 2.41 to
    # Bookworm's older glibc 2.36 produces a collation-version mismatch and can
    # invalidate ordering/index assumptions until every affected object is rebuilt.
    image: "${BACKUPSHEEP_POSTGRES_IMAGE:-backupsheep-postgres:local}"
    # Build only from the digest-pinned official PostgreSQL base and the reviewed
    # derived Dockerfile. A missing local tag is a hard failure, never a registry pull.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      # The official image necessarily initializes POSTGRES_USER as a cluster
      # superuser. Never reuse the long-lived Django runtime identity here.
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-backupsheep_bootstrap}
      # The official PostgreSQL entrypoint resolves this file and unsets the pointer
      # before it starts postgres, keeping the password out of container inspection.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
    secrets:
      - db_bootstrap_password
    volumes:
      # postgres:18+ images keep data in a versioned subdir of /var/lib/postgresql
      # and refuse to start when the mount is at the old .../data path.
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${POSTGRES_TMPFS_SIZE:-128m},mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3775,uid=999,gid=999
    pids_limit: "${POSTGRES_PIDS_LIMIT:-256}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-2g}"
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    shm_size: "${POSTGRES_SHM_SIZE:-256m}"
    stop_grace_period: "${POSTGRES_STOP_GRACE_PERIOD:-1m}"
    healthcheck:
      # pg_isready reports server readiness even when authentication fails. Prove
      # the rotated file-backed credential over the same TCP path used by Django.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /run/secrets/db_bootstrap_password)\" psql --no-password --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --tuples-only --no-align --command='SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-database
      - migrate-database
      - cloud-database
      - database-database
      - files-database
      - storage-database
      - logs-database
      - beat-database
      - preflight-database
      - provision-database
    logging: *default-logging
    restart: unless-stopped

  rabbitmq-volume-init:
    <<: *stateful-runtime
    user: "100:101"
    image: rabbitmq:4.3.5-alpine@sha256:d07d6a0657affe0354ae61b3ca1a3e4d244c247ac5d7e25940c8759658ce7ad7
    environment:
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      BACKUPSHEEP_RABBITMQ_DATA_GENERATION: "${BACKUPSHEEP_RABBITMQ_DATA_GENERATION:?BACKUPSHEEP_RABBITMQ_DATA_GENERATION is required}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-volume-init", "init"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/volume-init.sh:/usr/local/bin/backupsheep-rabbitmq-volume-init:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 32
    mem_limit: 64m
    cpus: "0.25"
    network_mode: none
    logging: *default-logging
    restart: "no"

  rabbitmq:
    <<: *stateful-runtime
    user: "100:101"
    image: rabbitmq:4.3.5-alpine@sha256:d07d6a0657affe0354ae61b3ca1a3e4d244c247ac5d7e25940c8759658ce7ad7
    # RabbitMQ derives its durable node database path from the node hostname.
    # Container IDs change on recreation, so keep the hostname stable or the same
    # named volume will appear to contain a brand-new, empty broker.
    hostname: rabbitmq
    # RabbitMQ 4.3 has no supported DEFAULT_PASS_FILE input. This reviewed wrapper
    # derives a salted hash into tmpfs and invokes the vendor entrypoint without ever
    # exporting the plaintext bootstrap credential.
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-entrypoint"]
    environment:
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      BACKUPSHEEP_RABBITMQ_DATA_GENERATION: "${BACKUPSHEEP_RABBITMQ_DATA_GENERATION:?BACKUPSHEEP_RABBITMQ_DATA_GENERATION is required}"
    secrets:
      - rabbitmq_bootstrap_password
    # Celery uses durable queues and persistent delivery, but RabbitMQ still needs
    # its own data directory persisted across container recreation. Without this,
    # `docker compose down && up` can discard queued backups before the database
    # recovery sweep gets a chance to republish them.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # BackupSheep uses late acknowledgements for durable, externally mutating
      # work. Database/file/storage commands can legitimately run for many hours,
      # so the broker timeout must exceed their longest supported command budget.
      - ./deploy/rabbitmq/90-backupsheep.conf:/etc/rabbitmq/conf.d/90-backupsheep.conf:ro
      - ./deploy/rabbitmq/entrypoint.sh:/usr/local/bin/backupsheep-rabbitmq-entrypoint:ro
      - ./deploy/rabbitmq/volume-init.sh:/usr/local/bin/backupsheep-rabbitmq-volume-init:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${RABBITMQ_TMPFS_SIZE:-128m},mode=1777
      - /var/log/rabbitmq:rw,noexec,nosuid,nodev,size=64m,mode=0750,uid=100,gid=101
      - /run/backupsheep-rabbitmq:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=100,gid=101
    pids_limit: "${RABBITMQ_PIDS_LIMIT:-512}"
    mem_limit: "${RABBITMQ_MEMORY_LIMIT:-1g}"
    cpus: "${RABBITMQ_CPU_LIMIT:-1.0}"
    stop_grace_period: "${RABBITMQ_STOP_GRACE_PERIOD:-3m}"
    healthcheck:
      # This first gate proves node readiness only. Every credential, permission and
      # topology invariant is reconciled and authenticated by rabbitmq-provision before
      # an application process is allowed to start.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-broker
      - cloud-broker
      - database-broker
      - files-broker
      - storage-broker
      - logs-broker
      - beat-broker
      - preflight-broker
      - provision-broker
    depends_on:
      rabbitmq-volume-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  # One-shot: reconcile the dedicated vhost after definitions import. It borrows only
  # the broker volume's Erlang cookie read-only, then deletes the legacy shared login,
  # rotates every role from its file secret, proves lane permissions and exits.
  rabbitmq-provision:
    <<: *stateful-runtime
    user: "100:101"
    image: rabbitmq:4.3.5-alpine@sha256:d07d6a0657affe0354ae61b3ca1a3e4d244c247ac5d7e25940c8759658ce7ad7
    environment:
      HOME: /var/lib/rabbitmq
      RABBITMQ_LEGACY_USER: "${RABBITMQ_LEGACY_USER:-backupsheep}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-provision"]
    secrets:
      - rabbitmq_bootstrap_password
      - rabbitmq_app_password
      - rabbitmq_preflight_password
      - rabbitmq_beat_password
      - rabbitmq_cloud_password
      - rabbitmq_database_password
      - rabbitmq_files_password
      - rabbitmq_storage_password
      - rabbitmq_logs_password
    volumes:
      - type: volume
        source: rabbitmq_data
        target: /var/lib/rabbitmq
        read_only: true
      - ./deploy/rabbitmq/provision.sh:/usr/local/bin/backupsheep-rabbitmq-provision:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - provision-broker
    logging: *default-logging
    restart: "no"

  # Root is confined to this networkless one-shot. It proves an installation-bound
  # witness, rejects ambiguous/non-empty shared work, and assigns the fixed UID/GID
  # layout before any application role can mount a staging or trust volume.
  staging-provision:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "0:0"
    entrypoint: ["/usr/local/bin/backupsheep-provision-staging-volumes"]
    environment:
      DJANGO_SERVER: prod
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      BACKUPSHEEP_STAGING_LAYOUT_INTENT: "${BACKUPSHEEP_STAGING_LAYOUT_INTENT:?BACKUPSHEEP_STAGING_LAYOUT_INTENT is required}"
      BACKUPSHEEP_STAGING_LAYOUT_WITNESS: "${BACKUPSHEEP_STAGING_LAYOUT_WITNESS:?BACKUPSHEEP_STAGING_LAYOUT_WITNESS is required}"
      BACKUPSHEEP_STAGING_MIN_FREE_BYTES: "${BACKUPSHEEP_STAGING_MIN_FREE_BYTES:-536870912}"
      BACKUPSHEEP_STAGING_MIN_FREE_INODES: "${BACKUPSHEEP_STAGING_MIN_FREE_INODES:-1024}"
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - type: volume
        source: database_workdir
        target: /volumes/database
        volume:
          nocopy: true
      - type: volume
        source: files_workdir
        target: /volumes/files
        volume:
          nocopy: true
      - type: volume
        source: storage_workdir
        target: /volumes/storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /volumes/database-transfer
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /volumes/files-transfer
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /volumes/restore-transfer
        volume:
          nocopy: true
      - type: volume
        source: backup_storage
        target: /volumes/backup-storage
        volume:
          nocopy: true
      - type: volume
        source: ssh_trust
        target: /volumes/ssh-trust
        volume:
          nocopy: true
      - type: volume
        source: backup_workdir
        target: /volumes/legacy
        volume:
          nocopy: true
      - type: volume
        source: staging_layout_witness
        target: /volumes/witness
        volume:
          nocopy: true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    network_mode: none
    logging: *default-logging
    restart: "no"

  # One-shot: provision the database identity boundary before Django can migrate or
  # serve. It connects as the database-only bootstrap superuser, creates/rotates the
  # marked migrator and runtime roles in one transaction, transfers reviewed public
  # object ownership to the migrator, and grants the runtime identity DML without DDL.
  db-provision:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      BACKUPSHEEP_DATABASE_IDENTITY_GENERATION: "${BACKUPSHEEP_DATABASE_IDENTITY_GENERATION:?BACKUPSHEEP_DATABASE_IDENTITY_GENERATION is required}"
      DB_BOOTSTRAP_USER: "${DB_BOOTSTRAP_USER:-backupsheep_bootstrap}"
      DB_MIGRATOR_USER: "${DB_MIGRATOR_USER:-backupsheep_migrator}"
      DB_USER: "${DB_USER:-backupsheep_runtime}"
      # Pin the only reviewed privileged route; do not let env_file/libpq redirect
      # the bootstrap credential to an external endpoint.
      DB_HOST: db
      DB_PORT: "5432"
      DB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_bootstrap_password
      - db_migrator_password
      - db_password
    command: ["python", "-m", "backupsheep.database_identity", "provision"]
    mem_limit: "${DB_PROVISION_MEMORY_LIMIT:-512m}"
    cpus: "${DB_PROVISION_CPU_LIMIT:-0.5}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - provision-database
    logging: *default-logging
    restart: "no"

  # One-shot: apply DB migrations once, then exit. Every app-image service below waits
  # for this to complete successfully so nothing serves/works against an unmigrated DB.
  migrate:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      DB_USER: "${DB_MIGRATOR_USER:-backupsheep_migrator}"
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets:
      - django_secret_key
      - db_migrator_password
    command: ["python", "manage.py", "migrate", "--noinput"]
    mem_limit: "${MIGRATE_MEMORY_LIMIT:-2g}"
    cpus: "${MIGRATE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
    networks:
      - migrate-database
    logging: *default-logging
    restart: "no"

  # One-shot fail-closed deployment gate. The command verifies production settings,
  # secret-file resolution, database/broker isolation, and required migrations before
  # either the web process or an externally mutating worker can start.
  preflight:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      BACKUPSHEEP_CELERY_LANE: preflight
      RABBITMQ_USER: backupsheep_preflight
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_preflight_password
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_preflight_password
      - celery_trusted_public_keys
    command: ["python", "manage.py", "docker_preflight"]
    mem_limit: "${PREFLIGHT_MEMORY_LIMIT:-1g}"
    cpus: "${PREFLIGHT_CPU_LIMIT:-1.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - preflight-database
      - preflight-broker
    logging: *default-logging
    restart: "no"

  app-egress-guard:
    <<: *egress-guard-runtime
    build:
      context: .
      dockerfile: Dockerfile.egress
    environment:
      BACKUPSHEEP_EGRESS_ROLE: app
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_APP_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV6:-}"
    ports:
      - "${BACKUPSHEEP_BIND_ADDRESS:-127.0.0.1}:${BACKUPSHEEP_BIND_PORT:-8000}:8000"
    networks:
      app-database: {}
      app-broker: {}
      app-egress:
        gw_priority: 1

  app:
    <<: *app-runtime
    build:
      context: .
      dockerfile: Dockerfile
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10001:10001"
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: web
      BACKUPSHEEP_CELERY_LANE: app
      RABBITMQ_USER: backupsheep_app
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_app_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_app_private_key
      ONBOARDING_INSTALL_TOKEN_SECRET_FILE: /run/secrets/onboarding_token
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_app_password
      - celery_signing_app_private_key
      - celery_trusted_public_keys
      - onboarding_token
    # Uses the image ENTRYPOINT (init.sh) to start gunicorn on :8000.
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      app-egress-guard:
        condition: service_healthy
    mem_limit: "${APP_MEMORY_LIMIT:-2g}"
    cpus: "${APP_CPU_LIMIT:-2.0}"
    volumes:
      # The Internet-facing web process can update only the reviewed SSH trust
      # database. It receives no backup_workdir mount, so staged archives, cache,
      # logs and worker locks are neither readable nor writable after web RCE.
      - type: volume
        source: ssh_trust
        target: /var/lib/backupsheep/ssh-trust
        volume:
          nocopy: true
      # Empty, read-only sentinel volume whose immutable Docker label lets the
      # installer prove project ownership even after `docker compose down` removes
      # all containers and networks. It contains no application or secret data.
      - type: volume
        source: installation_identity
        target: /run/backupsheep-installation
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    network_mode: service:app-egress-guard
    logging: *default-logging
    restart: unless-stopped

  cloud-egress-guard:
    <<: *egress-guard-runtime
    environment:
      BACKUPSHEEP_EGRESS_ROLE: cloud
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_CLOUD_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV6:-}"
    profiles: ["operations"]
    networks:
      cloud-database: {}
      cloud-broker: {}
      cloud-egress:
        gw_priority: 1

  # API-only provider snapshots + general/notification tasks. Stateless (no _storage
  # or /backups volume), so this is the only worker safe to scale horizontally.
  # Local Storage probes and every deletion path are routed to worker-storage. Cloud
  # tasks just wait on provider HTTP, so concurrency can run high.
  worker-cloud:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10008:10008"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10008,gid=10008
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: cloud
      BACKUPSHEEP_CELERY_LANE: cloud
      RABBITMQ_USER: backupsheep_cloud
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_cloud_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_cloud_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_cloud_password
      - celery_signing_cloud_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=cloud@%h", "-Q", "cloud,default", "--concurrency=${CELERY_CLOUD_CONCURRENCY:-4}", "--prefetch-multiplier=${CELERY_CLOUD_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_CLOUD_MEMORY_LIMIT:-1g}"
    cpus: "${WORKER_CLOUD_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      cloud-egress-guard:
        condition: service_healthy
    network_mode: service:cloud-egress-guard
    logging: *default-logging
    restart: unless-stopped

  database-egress-guard:
    <<: *egress-guard-runtime
    environment:
      BACKUPSHEEP_EGRESS_ROLE: database
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_DATABASE_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV6:-}"
    profiles: ["operations"]
    networks:
      database-database: {}
      database-broker: {}
      database-egress:
        gw_priority: 1

  # Database dumps (pg_dump/mysqldump). Plaintext remains in the database UID's
  # private volume; storage receives only a published BSE1 handoff.
  worker-database:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10002:10002"
    group_add:
      - "10989"
      - "10990"
      - "10994"
      - "10997"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10002,gid=10002
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: database
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/artifact_kms_database_aws_credentials
      BACKUPSHEEP_CELERY_LANE: database
      RABBITMQ_USER: backupsheep_database
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_database_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_database_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_database_password
      - celery_signing_database_private_key
      - celery_trusted_public_keys
      - ssh_managed_private_key
      - artifact_kms_database_aws_credentials
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=database@%h", "-Q", "database", "--concurrency=${CELERY_DATABASE_CONCURRENCY:-1}", "--prefetch-multiplier=${CELERY_DATABASE_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_DATABASE_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_DATABASE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      database-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: database_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/database
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: ssh_trust
        target: /var/lib/backupsheep/ssh-trust
        read_only: true
        volume:
          nocopy: true
    network_mode: service:database-egress-guard
    logging: *default-logging
    restart: unless-stopped

  files-egress-guard:
    <<: *egress-guard-runtime
    environment:
      BACKUPSHEEP_EGRESS_ROLE: files
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_FILES_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV6:-}"
    profiles: ["operations"]
    networks:
      files-database: {}
      files-broker: {}
      files-egress:
        gw_priority: 1

  # Website / WordPress / Basecamp source material stays private to the files UID.
  worker-files:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10003:10003"
    group_add:
      - "10991"
      - "10992"
      - "10993"
      - "10997"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10003,gid=10003
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: files
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/artifact_kms_files_aws_credentials
      BACKUPSHEEP_CELERY_LANE: files
      RABBITMQ_USER: backupsheep_files
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_files_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_files_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_files_password
      - celery_signing_files_private_key
      - celery_trusted_public_keys
      - ssh_managed_private_key
      - artifact_kms_files_aws_credentials
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=files@%h", "-Q", "files", "--concurrency=${CELERY_FILES_CONCURRENCY:-1}", "--prefetch-multiplier=${CELERY_FILES_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_FILES_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_FILES_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      files-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: files_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/files
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: ssh_trust
        target: /var/lib/backupsheep/ssh-trust
        read_only: true
        volume:
          nocopy: true
    network_mode: service:files-egress-guard
    logging: *default-logging
    restart: unless-stopped

  storage-egress-guard:
    <<: *egress-guard-runtime
    environment:
      BACKUPSHEEP_EGRESS_ROLE: storage
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_STORAGE_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV6:-}"
    profiles: ["operations"]
    networks:
      storage-database: {}
      storage-broker: {}
      storage-egress:
        gw_priority: 1

  # Dedicated upload pool copies source-owned BSE1 bytes into storage-private work,
  # verifies the durable hash/size, uploads, and cleans only its fenced paths.
  #     ./backupsheep-compose --profile operations up -d --scale worker-storage=4
  worker-storage:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10004:10004"
    group_add:
      - "10990"
      - "10992"
      - "10993"
      - "10994"
      - "10995"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10004,gid=10004
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: storage
      BACKUPSHEEP_CELERY_LANE: storage
      RABBITMQ_USER: backupsheep_storage
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_storage_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_storage_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_storage_password
      - celery_signing_storage_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=storage@%h", "-Q", "storage", "--concurrency=${CELERY_STORAGE_CONCURRENCY:-2}", "--prefetch-multiplier=${CELERY_STORAGE_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_STORAGE_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_STORAGE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      storage-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: storage_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/database
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/files
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        volume:
          nocopy: true
      - type: volume
        source: backup_storage
        target: /backups
        volume:
          nocopy: true
    network_mode: service:storage-egress-guard
    logging: *default-logging
    restart: unless-stopped

  logs-egress-guard:
    <<: *egress-guard-runtime
    environment:
      BACKUPSHEEP_EGRESS_ROLE: logs
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_LOGS_EGRESS_MODE:-public}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV6:-}"
    profiles: ["operations"]
    networks:
      logs-database: {}
      logs-broker: {}
      logs-egress:
        gw_priority: 1

  # Log pipeline: writes log entries to the DB (send_log_to_db) and fans out
  # Slack/Telegram notifications. Local run-log pruning is routed to worker-storage,
  # keeping this externally connected notification role away from staged artifacts.
  worker-logs:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10005:10005"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10005,gid=10005
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: logs
      BACKUPSHEEP_CELERY_LANE: logs
      RABBITMQ_USER: backupsheep_logs
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_logs_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_logs_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_logs_password
      - celery_signing_logs_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=logs@%h", "-Q", "logs", "--concurrency=${CELERY_LOGS_CONCURRENCY:-2}", "--prefetch-multiplier=${CELERY_LOGS_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_LOGS_MEMORY_LIMIT:-512m}"
    cpus: "${WORKER_LOGS_CPU_LIMIT:-1.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      logs-egress-guard:
        condition: service_healthy
    network_mode: service:logs-egress-guard
    logging: *default-logging
    restart: unless-stopped

  beat:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10006:10006"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10006,gid=10006
    env_file: .env
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: beat
      BACKUPSHEEP_CELERY_LANE: beat
      RABBITMQ_USER: backupsheep_beat
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_beat_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_beat_private_key
    secrets:
      - django_secret_key
      - db_password
      - rabbitmq_beat_password
      - celery_signing_beat_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "beat", "--loglevel=info", "--scheduler", "backupsheep.scheduler:BackupDatabaseScheduler"]
    profiles: ["operations"]
    mem_limit: "${BEAT_MEMORY_LIMIT:-512m}"
    cpus: "${BEAT_CPU_LIMIT:-0.5}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
    networks:
      - beat-database
      - beat-broker
    logging: *default-logging
    restart: unless-stopped

networks:
  app-database: *internal-network
  app-broker: *internal-network
  migrate-database: *internal-network
  cloud-database: *internal-network
  cloud-broker: *internal-network
  database-database: *internal-network
  database-broker: *internal-network
  files-database: *internal-network
  files-broker: *internal-network
  storage-database: *internal-network
  storage-broker: *internal-network
  logs-database: *internal-network
  logs-broker: *internal-network
  beat-database: *internal-network
  beat-broker: *internal-network
  preflight-database: *internal-network
  preflight-broker: *internal-network
  provision-database: *internal-network
  provision-broker: *internal-network
  app-egress: *egress-network
  cloud-egress: *egress-network
  database-egress: *egress-network
  files-egress: *egress-network
  storage-egress: *egress-network
  logs-egress: *egress-network

volumes:
  pgdata:
  rabbitmq_data:
  # Legacy shared work is visible only to staging-provision. Existing installs must
  # prove it empty before the new per-lane layout receives a durable witness.
  backup_workdir:
  database_workdir:
  files_workdir:
  storage_workdir:
  database_ciphertext_transfer:
  files_ciphertext_transfer:
  restore_ciphertext_transfer:
  staging_layout_witness:
  # UI-approved host keys are isolated from staged backup data. The app is the
  # only writer; SSH-capable workers mount this trust store read-only.
  ssh_trust:
  # This is where 'Local Storage' backups live (mounted at /backups in the app and
  # worker containers). To keep backups on a big disk or an NFS share instead of the
  # Docker-managed volume, override with a bind mount in docker-compose.override.yml:
  #   volumes:
  #     backup_storage:
  #       driver: local
  #       driver_opts:
  #         type: none
  #         o: bind
  #         device: /mnt/storage/backupsheep
  backup_storage:
  installation_identity:
    labels: *installation-labels

# Compose bind-mounts these installation files read-only under /run/secrets,
# so their values never appear in container inspection. Environment-sourced Compose
# secrets cannot be materialized into an immutable root filesystem; the installer
# therefore owns `.secrets` as a mode-0700 directory containing mode-0444 files. The
# private directory blocks host traversal while the bind-mounted file stays readable by
# the non-root container UID. This is application state, not a host-security change.
secrets:
  django_secret_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/django_secret_key
  db_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_password
  db_bootstrap_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_bootstrap_password
  db_migrator_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_migrator_password
  rabbitmq_bootstrap_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_bootstrap_password
  rabbitmq_app_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_app_password
  rabbitmq_preflight_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_preflight_password
  rabbitmq_beat_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_beat_password
  rabbitmq_cloud_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_cloud_password
  rabbitmq_database_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_database_password
  rabbitmq_files_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_files_password
  rabbitmq_storage_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_storage_password
  rabbitmq_logs_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_logs_password
  celery_signing_app_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_app_private_key
  celery_signing_beat_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_beat_private_key
  celery_signing_cloud_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_cloud_private_key
  celery_signing_database_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_database_private_key
  celery_signing_files_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_files_private_key
  celery_signing_storage_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_storage_private_key
  celery_signing_logs_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_logs_private_key
  celery_trusted_public_keys:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_trusted_public_keys
  onboarding_token:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/onboarding_token
  ssh_managed_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/ssh_managed_private_key
  artifact_kms_database_aws_credentials:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/artifact_kms_database_aws_credentials
  artifact_kms_files_aws_credentials:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/artifact_kms_files_aws_credentials
