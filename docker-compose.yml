# Settings resolves installation credentials from read-only secret files. Only the
# web service receives the onboarding token secret; integration values are blanked
# here and restored by the exact consumer below.
x-app-secret-environment: &app-secret-environment
  <<: *app-configuration-environment
  # Blank loader/proxy hooks explicitly as defense in depth for hand-written
  # Compose overrides. The image entrypoint independently rejects/unsets them.
  LD_AUDIT: ""
  LD_LIBRARY_PATH: ""
  LD_PRELOAD: ""
  SSLKEYLOGFILE: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  no_proxy: ""
  REQUESTS_CA_BUNDLE: ""
  CURL_CA_BUNDLE: ""
  # The stock image also supports a JSON configuration blob for non-Compose PaaS
  # deployments. Suppress that alternate source here so it cannot replace the
  # reviewed .env plus file-backed secret model. Pin the only settings module whose
  # deployment preflight and hardening contract are reviewed by this stack.
  BACKUPSHEEP_SECRETS: ""
  DJANGO_SETTINGS_MODULE: backupsheep.settings
  DJANGO_SECRET_KEY: ""
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  # URL-style overrides embed credentials and take precedence over the reviewed
  # file-backed fragments in Django/Celery. Blank them even when a legacy .env
  # still contains one; the deployment preflight independently enforces this.
  DATABASE_URL: ""
  DB_PASSWORD: ""
  DB_PASSWORD_FILE: ""
  CELERY_BROKER_URL: ""
  RABBITMQ_PASSWORD: ""
  RABBITMQ_PASSWORD_FILE: ""
  # Stock Docker authenticates every Celery publication with a lane-specific
  # Ed25519 key. Consumers receive the public registry, never another lane's key.
  BACKUPSHEEP_CELERY_SECURITY_REQUIRED: "true"
  BACKUPSHEEP_CELERY_SECURITY_GENERATION: "${BACKUPSHEEP_CELERY_SECURITY_GENERATION:?BACKUPSHEEP_CELERY_SECURITY_GENERATION is required}"
  CELERY_SIGNING_PRIVATE_KEY_FILE: ""
  CELERY_TRUSTED_PUBLIC_KEYS_FILE: /run/secrets/celery_trusted_public_keys
  ONBOARDING_INSTALL_TOKEN: ""
  # Keep lane-specific managed identities out of shared volumes.
  # Every role may advertise the two public identities; each source worker mounts
  # only its own private half and init.sh exports the generic runtime path.
  SSH_MANAGED_PRIVATE_KEY_PATH: ""
  SSH_MANAGED_PUBLIC_KEY: ""
  SSH_MANAGED_DATABASE_PUBLIC_KEY: "${SSH_MANAGED_DATABASE_PUBLIC_KEY:-}"
  SSH_MANAGED_FILES_PUBLIC_KEY: "${SSH_MANAGED_FILES_PUBLIC_KEY:-}"
  SSH_MANAGED_LANE_ISOLATION_REQUIRED: "true"
  # Stock enterprise custody is BSE1-only. Database and files receive distinct
  # bounded local-file keyrings; no other role receives root wrapping material.
  BACKUPSHEEP_ARTIFACT_ENCRYPTION_MODE: bse1
  BACKUPSHEEP_ARTIFACT_ENTERPRISE_MODE: "true"
  BACKUPSHEEP_ARTIFACT_ALLOW_LEGACY_RESTORE: "false"
  BACKUPSHEEP_ARTIFACT_KEY_PROVIDER: local-file
  BACKUPSHEEP_ARTIFACT_KEY_PROVIDER_GENERATION: "${BACKUPSHEEP_ARTIFACT_KEY_PROVIDER_GENERATION:-}"
  BACKUPSHEEP_ARTIFACT_KEY_PROVIDER_WITNESS: "${BACKUPSHEEP_ARTIFACT_KEY_PROVIDER_WITNESS:-}"
  BACKUPSHEEP_ARTIFACT_LOCAL_FILE_KEYRING_PATH: ""
  BACKUPSHEEP_PLAINTEXT_ROOT: /code/_storage
  BACKUPSHEEP_DATABASE_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/transfer/database
  BACKUPSHEEP_FILES_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/transfer/files
  BACKUPSHEEP_RESTORE_CIPHERTEXT_TRANSFER_ROOT: /var/lib/backupsheep/restore-transfer
  BACKUPSHEEP_PRIVATE_MIN_FREE_BYTES: "${BACKUPSHEEP_PRIVATE_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_PRIVATE_MIN_FREE_INODES: "${BACKUPSHEEP_PRIVATE_MIN_FREE_INODES:-1024}"
  BACKUPSHEEP_TRANSFER_MIN_FREE_BYTES: "${BACKUPSHEEP_TRANSFER_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_TRANSFER_MIN_FREE_INODES: "${BACKUPSHEEP_TRANSFER_MIN_FREE_INODES:-1024}"
  BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_BYTES: "${BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_BYTES:-536870912}"
  BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_INODES: "${BACKUPSHEEP_RESTORE_TRANSFER_MIN_FREE_INODES:-1024}"
  # Empty every ambient AWS SDK credential, role, metadata, and endpoint source.
  # Provider integrations use their own scoped credentials stored by BackupSheep;
  # no container inherits a shared SDK credential path.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  AWS_SECURITY_TOKEN: ""
  AWS_PROFILE: ""
  AWS_DEFAULT_PROFILE: ""
  AWS_CONFIG_FILE: ""
  AWS_CA_BUNDLE: ""
  AWS_METADATA_SERVICE_ENDPOINT: ""
  AWS_METADATA_SERVICE_ENDPOINT_MODE: ""
  BOTO_CONFIG: ""
  AWS_WEB_IDENTITY_TOKEN_FILE: ""
  AWS_ROLE_ARN: ""
  AWS_ROLE_SESSION_NAME: ""
  AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
  AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
  AWS_CONTAINER_AUTHORIZATION_TOKEN: ""
  AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE: ""
  AWS_ENDPOINT_URL: ""
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_EC2_METADATA_V1_DISABLED: "true"
  AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: "true"
  AWS_SHARED_CREDENTIALS_FILE: ""

  # Deployment-wide integration credentials must not become ambient secrets in every
  # Django/Celery process. Each actual consumer restores only its own values below.
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_STORAGE_BUCKET_NAME: ""
  S3_ENDPOINT_URL: ""
  S3_SIGNATURE_VERSION: ""
  # Legacy hosted-deployment names are blanked too. They are not part of the current
  # sample, but old .env files must not leak them into unrelated lanes during upgrade.
  AWS_S3_ACCESS_KEY: ""
  AWS_S3_SECRET_ACCESS_KEY: ""
  AWS_S3_LOGS_BUCKET: ""
  AWS_S3_LOGS_ENDPOINT: ""
  AWS_S3_LOGS_REGION: ""
  LOGS_S3_ACCESS_KEY_ID: ""
  LOGS_S3_SECRET_ACCESS_KEY: ""
  LOGS_S3_BUCKET: ""
  LOGS_S3_ENDPOINT: ""
  POSTMARK_API_KEY: ""
  POSTMARK_DOMAIN: ""
  POSTMARK_EMAIL: ""
  POSTMARK_API_URL: ""
  SES_REGION_NAME: ""
  SES_REGION_ENDPOINT: ""
  SES_ACCESS_KEY_ID: ""
  SES_SECRET_ACCESS_KEY: ""
  AWS_SES_REGION_NAME: ""
  AWS_SES_REGION_ENDPOINT: ""
  AWS_SES_ACCESS_KEY_ID: ""
  AWS_SES_SECRET_ACCESS_KEY: ""
  MAILGUN_DOMAIN: ""
  MAILGUN_EMAIL: ""
  MAILGUN_API_KEY: ""
  MAILGUN_API_URL: ""
  EMAIL_PROVIDER: ""
  SLACK_TOKEN_URL: ""
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  TELEGRAM_BOT_KEY: ""
  DROPBOX_APP_KEY: ""
  DROPBOX_APP_SECRET: ""
  PCLOUD_CLIENT_ID: ""
  PCLOUD_CLIENT_SECRET: ""
  BASECAMP_CLIENT_ID: ""
  BASECAMP_CLIENT_SECRET: ""
  MS_CLIENT_ID: ""
  MS_OBJECT_ID: ""
  MS_TENANT_ID: ""
  MS_APPLICATION_ID: ""
  MS_CLIENT_SECRET_VALUE: ""
  MS_CLIENT_SECRET_ID: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  DIGITALOCEAN_APP_CLIENT_ID: ""
  DIGITALOCEAN_APP_CLIENT_SECRET: ""
  OVH_CA_APP_KEY: ""
  OVH_CA_APP_SECRET: ""
  OVH_EU_APP_KEY: ""
  OVH_EU_APP_SECRET: ""
  OVH_US_APP_KEY: ""
  OVH_US_APP_SECRET: ""

# Shared stateful-service controls. PostgreSQL and RabbitMQ start directly as their
# fixed non-root users with an empty capability bounding set. A separate non-networked
# RabbitMQ one-shot proves its already-correct named-volume ownership before startup.
x-stateful-runtime: &stateful-runtime
  labels: *installation-labels
  # Every supported stateful image is built or verified explicitly. A missing
  # local tag must fail instead of falling back to a mutable registry lookup.
  pull_policy: never
  privileged: false
  read_only: true
  init: false
  # Do not inject Docker's root-owned init shim here. The reviewed entrypoints
  # exec their long-running servers directly as fixed non-root PID 1 processes,
  # which handle their own documented shutdown paths.
  cgroup: private
  ipc: private
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    core:
      soft: 0
      hard: 0
    nofile:
      soft: 65536
      hard: 65536

# One externally routed bridge per outward-facing role prevents compromised roles from
# reaching each other on their egress interface. Each outward service assigns that
# bridge `gw_priority: 1` so an internal bridge cannot become its default route.
x-egress-network: &egress-network
  attachable: false
  driver_opts:
    com.docker.network.bridge.enable_icc: "false"

# Every database/broker attachment is a distinct internal bridge. A worker can reach
# only its required stateful endpoints, not another BackupSheep role. The database and
# broker never share a bridge with each other.
x-internal-network: &internal-network
  internal: true
  attachable: false

# Guard-side service discovery is non-secret, but it is still security-critical:
# each namespace resolves these two stock service names onto its own dedicated
# internal bridges and permits only the exact address/interface/TCP-port tuples.
x-egress-internal-peer-environment: &egress-internal-peer-environment
  BACKUPSHEEP_EGRESS_POLICY_GENERATION: "${BACKUPSHEEP_EGRESS_POLICY_GENERATION:?BACKUPSHEEP_EGRESS_POLICY_GENERATION is required}"
  BACKUPSHEEP_EGRESS_DATABASE_HOST: "${DB_HOST:-db}"
  BACKUPSHEEP_EGRESS_DATABASE_PORT: "${DB_PORT:-5432}"
  BACKUPSHEEP_EGRESS_BROKER_HOST: "${RABBITMQ_HOST:-rabbitmq}"
  BACKUPSHEEP_EGRESS_BROKER_PORT: "${RABBITMQ_PORT:-5672}"
  BACKUPSHEEP_EGRESS_DNS_REFRESH_SECONDS: "1"

services:
  db:
    <<: *stateful-runtime
    # Defense in depth with the image USER declaration: never enter the vendor
    # entrypoint's root ownership-repair branch for the stock named volume.
    user: "70:70"
    # This Alpine/ICU runtime has a distinct storage generation. The legacy
    # Debian/glibc `pgdata` volume is deliberately absent from this model and can be
    # migrated only by the installer's stop-the-world logical migration gate.
    image: "${BACKUPSHEEP_POSTGRES_IMAGE:-backupsheep-postgres:local}"
    # Build only from the digest-pinned official PostgreSQL base and the reviewed
    # derived Dockerfile. A missing local tag is a hard failure, never a registry pull.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      # The official image necessarily initializes POSTGRES_USER as a cluster
      # superuser. Never reuse the long-lived Django runtime identity here.
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-backupsheep_bootstrap}
      # The official PostgreSQL entrypoint resolves this file and unsets the pointer
      # before it starts postgres, keeping the password out of container inspection.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --encoding=UTF8 --auth-local=scram-sha-256 --auth-host=scram-sha-256"
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      BACKUPSHEEP_POSTGRES_STORAGE_GENERATION: "${BACKUPSHEEP_POSTGRES_STORAGE_GENERATION:?BACKUPSHEEP_POSTGRES_STORAGE_GENERATION is required}"
      BACKUPSHEEP_POSTGRES_STORAGE_INTENT: "${BACKUPSHEEP_POSTGRES_STORAGE_INTENT:?BACKUPSHEEP_POSTGRES_STORAGE_INTENT is required}"
      BACKUPSHEEP_POSTGRES_STORAGE_WITNESS: "${BACKUPSHEEP_POSTGRES_STORAGE_WITNESS:?BACKUPSHEEP_POSTGRES_STORAGE_WITNESS is required}"
    secrets:
      - db_bootstrap_password
    volumes:
      # postgres:18+ images keep data in a versioned subdir of /var/lib/postgresql
      # and refuse to start when the mount is at the old .../data path.
      # The digest-pinned derived image must seed the fixed-UID PostgreSQL root
      # on first use. Keep Docker copy-up explicit; runtime attestation permits
      # this exact NoCopy=false stateful-root exception and no other implicit copy.
      - type: volume
        source: postgres_data_v1
        target: /var/lib/postgresql
        volume:
          nocopy: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${POSTGRES_TMPFS_SIZE:-128m},mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3775,uid=70,gid=70
    pids_limit: "${POSTGRES_PIDS_LIMIT:-256}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-2g}"
    memswap_limit: "${POSTGRES_MEMORY_LIMIT:-2g}"
    mem_swappiness: 0
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    shm_size: "${POSTGRES_SHM_SIZE:-256m}"
    stop_grace_period: "${POSTGRES_STOP_GRACE_PERIOD:-1m}"
    healthcheck:
      # pg_isready reports server readiness even when authentication fails. Prove
      # the rotated file-backed credential over the same TCP path used by Django.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /run/secrets/db_bootstrap_password)\" psql --no-password --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --tuples-only --no-align --command='SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-database
      - migrate-database
      - cloud-database
      - database-database
      - files-database
      - storage-database
      - logs-database
      - beat-database
      - preflight-database
      - provision-database
    logging: *default-logging
    restart: unless-stopped

  rabbitmq-volume-init:
    <<: *stateful-runtime
    user: "100:101"
    image: "${BACKUPSHEEP_RABBITMQ_IMAGE:-backupsheep-rabbitmq:local}"
    environment:
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      # A blank legacy witness must remain renderable for the ownership-checked
      # migration gate. The in-container volume witness accepts only exact 4.3.
      BACKUPSHEEP_RABBITMQ_DATA_GENERATION: "${BACKUPSHEEP_RABBITMQ_DATA_GENERATION:-unattested}"
      BACKUPSHEEP_RABBITMQ_NODE_HOST: "${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-volume-init", "init"]
    volumes:
      # The digest-pinned official image seeds this fresh root as uid 100:gid 101.
      # This rootless-compatible copy-up is an exact attested exception.
      - type: volume
        source: rabbitmq_data
        target: /var/lib/rabbitmq
        volume:
          nocopy: false
      - ./deploy/rabbitmq/volume-init.sh:/usr/local/bin/backupsheep-rabbitmq-volume-init:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 32
    mem_limit: 64m
    memswap_limit: 64m
    mem_swappiness: 0
    cpus: "0.25"
    network_mode: none
    logging: *default-logging
    restart: "no"

  rabbitmq:
    <<: *stateful-runtime
    user: "100:101"
    image: "${BACKUPSHEEP_RABBITMQ_IMAGE:-backupsheep-rabbitmq:local}"
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    # RabbitMQ derives its durable node database path from the node hostname.
    # Container IDs change on recreation, so keep the hostname stable or the same
    # named volume will appear to contain a brand-new, empty broker.
    hostname: "${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
    # RabbitMQ 4.3 has no supported DEFAULT_PASS_FILE input. This reviewed wrapper
    # derives a salted hash into tmpfs and invokes the vendor entrypoint without ever
    # exporting the plaintext bootstrap credential.
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-entrypoint"]
    environment:
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      # Direct Compose bypass with a blank/invalid witness fails in volume-init
      # before the broker entrypoint can open the durable data directory.
      BACKUPSHEEP_RABBITMQ_DATA_GENERATION: "${BACKUPSHEEP_RABBITMQ_DATA_GENERATION:-unattested}"
      BACKUPSHEEP_RABBITMQ_NODE_HOST: "${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
      RABBITMQ_NODENAME: "rabbit@${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
    secrets:
      - rabbitmq_bootstrap_password
    # Celery uses durable queues and persistent delivery, but RabbitMQ still needs
    # its own data directory persisted across container recreation. Without this,
    # `docker compose down && up` can discard queued backups before the database
    # recovery sweep gets a chance to republish them.
    volumes:
      - type: volume
        source: rabbitmq_data
        target: /var/lib/rabbitmq
        volume:
          nocopy: false
      # BackupSheep uses late acknowledgements for durable, externally mutating
      # work. Database/file/storage commands can legitimately run for many hours,
      # so the broker timeout must exceed their longest supported command budget.
      - ./deploy/rabbitmq/90-backupsheep.conf:/etc/rabbitmq/conf.d/90-backupsheep.conf:ro
      - ./deploy/rabbitmq/entrypoint.sh:/usr/local/bin/backupsheep-rabbitmq-entrypoint:ro
      - ./deploy/rabbitmq/volume-init.sh:/usr/local/bin/backupsheep-rabbitmq-volume-init:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${RABBITMQ_TMPFS_SIZE:-128m},mode=1777
      - /var/log/rabbitmq:rw,noexec,nosuid,nodev,size=64m,mode=0750,uid=100,gid=101
      - /run/backupsheep-rabbitmq:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=100,gid=101
    pids_limit: "${RABBITMQ_PIDS_LIMIT:-512}"
    mem_limit: "${RABBITMQ_MEMORY_LIMIT:-1g}"
    memswap_limit: "${RABBITMQ_MEMORY_LIMIT:-1g}"
    mem_swappiness: 0
    cpus: "${RABBITMQ_CPU_LIMIT:-1.0}"
    stop_grace_period: "${RABBITMQ_STOP_GRACE_PERIOD:-3m}"
    healthcheck:
      # This first gate proves node readiness only. Every credential, permission and
      # topology invariant is reconciled and authenticated by rabbitmq-provision before
      # an application process is allowed to start.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q -n \"$${RABBITMQ_NODENAME}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      app-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      cloud-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      database-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      files-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      storage-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      logs-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      beat-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      preflight-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
      provision-broker:
        aliases: ["${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"]
    depends_on:
      rabbitmq-volume-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  # One-shot: reconcile the dedicated vhost after definitions import. It borrows only
  # the broker volume's Erlang cookie read-only, then deletes the legacy shared login,
  # rotates every role from its file secret, proves lane permissions and exits.
  rabbitmq-provision:
    <<: *stateful-runtime
    user: "100:101"
    image: "${BACKUPSHEEP_RABBITMQ_IMAGE:-backupsheep-rabbitmq:local}"
    environment:
      HOME: /var/lib/rabbitmq
      RABBITMQ_LEGACY_USER: "${RABBITMQ_LEGACY_USER:-backupsheep}"
      BACKUPSHEEP_RABBITMQ_NODE_HOST: "${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
      RABBITMQ_NODENAME: "rabbit@${BACKUPSHEEP_RABBITMQ_NODE_HOST:?BACKUPSHEEP_RABBITMQ_NODE_HOST is required}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backupsheep-rabbitmq-provision"]
    secrets:
      - rabbitmq_bootstrap_password
      - rabbitmq_app_password
      - rabbitmq_preflight_password
      - rabbitmq_beat_password
      - rabbitmq_cloud_password
      - rabbitmq_database_password
      - rabbitmq_files_password
      - rabbitmq_storage_password
      - rabbitmq_logs_password
    volumes:
      - type: volume
        source: rabbitmq_data
        target: /var/lib/rabbitmq
        read_only: true
        volume:
          nocopy: true
      - ./deploy/rabbitmq/provision.sh:/usr/local/bin/backupsheep-rabbitmq-provision:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    mem_swappiness: 0
    cpus: "0.5"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - provision-broker
    logging: *default-logging
    restart: "no"

  # Root is confined to this networkless one-shot. It proves an installation-bound
  # witness, rejects ambiguous/non-empty shared work, and assigns the fixed UID/GID
  # layout before any application role can mount a staging volume.
  staging-provision:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "0:0"
    entrypoint: ["/usr/local/bin/backupsheep-provision-staging-volumes"]
    environment:
      DJANGO_SERVER: prod
      BACKUPSHEEP_INSTALLATION_ID: "${BACKUPSHEEP_INSTALLATION_ID:?BACKUPSHEEP_INSTALLATION_ID is required}"
      BACKUPSHEEP_STAGING_LAYOUT_INTENT: "${BACKUPSHEEP_STAGING_LAYOUT_INTENT:?BACKUPSHEEP_STAGING_LAYOUT_INTENT is required}"
      BACKUPSHEEP_STAGING_LAYOUT_WITNESS: "${BACKUPSHEEP_STAGING_LAYOUT_WITNESS:?BACKUPSHEEP_STAGING_LAYOUT_WITNESS is required}"
      BACKUPSHEEP_STAGING_MIN_FREE_BYTES: "${BACKUPSHEEP_STAGING_MIN_FREE_BYTES:-536870912}"
      BACKUPSHEEP_STAGING_MIN_FREE_INODES: "${BACKUPSHEEP_STAGING_MIN_FREE_INODES:-1024}"
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      # Required only while this networkless one-shot applies mode 3771 after
      # changing transfer-volume ownership; without FSETID the kernel clears setgid.
      - FSETID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - type: volume
        source: database_workdir
        target: /volumes/database
        volume:
          nocopy: true
      - type: volume
        source: files_workdir
        target: /volumes/files
        volume:
          nocopy: true
      - type: volume
        source: storage_workdir
        target: /volumes/storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /volumes/database-transfer
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /volumes/files-transfer
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /volumes/restore-transfer
        volume:
          nocopy: true
      - type: volume
        source: backup_storage
        target: /volumes/backup-storage
        volume:
          nocopy: true
      - type: volume
        source: backup_workdir
        target: /volumes/legacy
        volume:
          nocopy: true
      - type: volume
        source: staging_layout_witness
        target: /volumes/witness
        volume:
          nocopy: true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    mem_swappiness: 0
    cpus: "0.25"
    network_mode: none
    logging: *default-logging
    restart: "no"

  # One-shot: provision the database identity boundary before Django can migrate or
  # serve. It connects as the database-only bootstrap superuser, creates/rotates the
  # marked migrator and per-lane roles in one transaction, transfers reviewed public
  # object ownership to the migrator, and removes all runtime access until db-seal.
  db-provision:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      # Provision/seal may run while install.sh deliberately leaves the durable .env
      # witness pending. Long-lived services inherit that pending value and fail closed
      # until db-seal exits successfully and the installer promotes generation 3.
      BACKUPSHEEP_DATABASE_IDENTITY_GENERATION: "3"
      DB_BOOTSTRAP_USER: "${DB_BOOTSTRAP_USER:-backupsheep_bootstrap}"
      DB_MIGRATOR_USER: "${DB_MIGRATOR_USER:-backupsheep_migrator}"
      DB_APP_USER: "${DB_APP_USER:-backupsheep_app}"
      DB_PREFLIGHT_USER: "${DB_PREFLIGHT_USER:-backupsheep_preflight}"
      DB_BEAT_USER: "${DB_BEAT_USER:-backupsheep_beat}"
      DB_CLOUD_USER: "${DB_CLOUD_USER:-backupsheep_cloud}"
      DB_DATABASE_USER: "${DB_DATABASE_USER:-backupsheep_database}"
      DB_FILES_USER: "${DB_FILES_USER:-backupsheep_files}"
      DB_STORAGE_USER: "${DB_STORAGE_USER:-backupsheep_storage}"
      DB_LOGS_USER: "${DB_LOGS_USER:-backupsheep_logs}"
      DB_USER: ""
      # Pin the only reviewed privileged route; do not let libpq overrides redirect
      # the bootstrap credential to an external endpoint.
      DB_HOST: db
      DB_PORT: "5432"
      DB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      DB_PREFLIGHT_PASSWORD_FILE: /run/secrets/db_preflight_password
      DB_BEAT_PASSWORD_FILE: /run/secrets/db_beat_password
      DB_CLOUD_PASSWORD_FILE: /run/secrets/db_cloud_password
      DB_DATABASE_PASSWORD_FILE: /run/secrets/db_database_password
      DB_FILES_PASSWORD_FILE: /run/secrets/db_files_password
      DB_STORAGE_PASSWORD_FILE: /run/secrets/db_storage_password
      DB_LOGS_PASSWORD_FILE: /run/secrets/db_logs_password
    secrets:
      - db_bootstrap_password
      - db_migrator_password
      - db_app_password
      - db_preflight_password
      - db_beat_password
      - db_cloud_password
      - db_database_password
      - db_files_password
      - db_storage_password
      - db_logs_password
    command: ["python", "-m", "backupsheep.database_identity", "provision"]
    mem_limit: "${DB_PROVISION_MEMORY_LIMIT:-512m}"
    memswap_limit: "${DB_PROVISION_MEMORY_LIMIT:-512m}"
    cpus: "${DB_PROVISION_CPU_LIMIT:-0.5}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - provision-database
    logging: *default-logging
    restart: "no"

  # One-shot: apply DB migrations once, then exit. Every app-image service below waits
  # for this to complete successfully so nothing serves/works against an unmigrated DB.
  migrate:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      # Django imports the Celery settings while applying migrations. Use the
      # zero-queue preflight broker identity rather than granting a publisher key;
      # migrate never connects to RabbitMQ and cannot sign a task accidentally.
      BACKUPSHEEP_CELERY_LANE: preflight
      DB_USER: "${DB_MIGRATOR_USER:-backupsheep_migrator}"
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      RABBITMQ_USER: backupsheep_preflight
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_preflight_password
    secrets:
      - django_secret_key
      - db_migrator_password
      - rabbitmq_preflight_password
    command: ["python", "manage.py", "migrate_and_verify_artifact_provider"]
    mem_limit: "${MIGRATE_MEMORY_LIMIT:-2g}"
    memswap_limit: "${MIGRATE_MEMORY_LIMIT:-2g}"
    cpus: "${MIGRATE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
    networks:
      - migrate-database
    logging: *default-logging
    restart: "no"

  # One-shot: after Django migrations, replace every broad/default grant with the
  # reviewed per-lane table, column, sequence and routine ACLs, enable RLS on
  # cross-lane ledgers, and bind policy comments to this installation. The bootstrap
  # credential never enters a long-lived service.
  db-seal:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      BACKUPSHEEP_DATABASE_IDENTITY_GENERATION: "3"
      DB_BOOTSTRAP_USER: "${DB_BOOTSTRAP_USER:-backupsheep_bootstrap}"
      DB_MIGRATOR_USER: "${DB_MIGRATOR_USER:-backupsheep_migrator}"
      DB_APP_USER: "${DB_APP_USER:-backupsheep_app}"
      DB_PREFLIGHT_USER: "${DB_PREFLIGHT_USER:-backupsheep_preflight}"
      DB_BEAT_USER: "${DB_BEAT_USER:-backupsheep_beat}"
      DB_CLOUD_USER: "${DB_CLOUD_USER:-backupsheep_cloud}"
      DB_DATABASE_USER: "${DB_DATABASE_USER:-backupsheep_database}"
      DB_FILES_USER: "${DB_FILES_USER:-backupsheep_files}"
      DB_STORAGE_USER: "${DB_STORAGE_USER:-backupsheep_storage}"
      DB_LOGS_USER: "${DB_LOGS_USER:-backupsheep_logs}"
      DB_USER: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      DB_PREFLIGHT_PASSWORD_FILE: /run/secrets/db_preflight_password
      DB_BEAT_PASSWORD_FILE: /run/secrets/db_beat_password
      DB_CLOUD_PASSWORD_FILE: /run/secrets/db_cloud_password
      DB_DATABASE_PASSWORD_FILE: /run/secrets/db_database_password
      DB_FILES_PASSWORD_FILE: /run/secrets/db_files_password
      DB_STORAGE_PASSWORD_FILE: /run/secrets/db_storage_password
      DB_LOGS_PASSWORD_FILE: /run/secrets/db_logs_password
    secrets:
      - db_bootstrap_password
      - db_migrator_password
      - db_app_password
      - db_preflight_password
      - db_beat_password
      - db_cloud_password
      - db_database_password
      - db_files_password
      - db_storage_password
      - db_logs_password
    command: ["python", "-m", "backupsheep.database_identity", "seal"]
    mem_limit: "${DB_SEAL_MEMORY_LIMIT:-1g}"
    memswap_limit: "${DB_SEAL_MEMORY_LIMIT:-1g}"
    cpus: "${DB_SEAL_CPU_LIMIT:-1.0}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - provision-database
    logging: *default-logging
    restart: "no"

  # One-shot fail-closed deployment gate. The command verifies production settings,
  # secret-file resolution, database/broker isolation, and required migrations before
  # either the web process or an externally mutating worker can start.
  preflight:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10007:10007"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10007,gid=10007
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: migration
      BACKUPSHEEP_DATABASE_LANE: preflight
      BACKUPSHEEP_CELERY_LANE: preflight
      DB_USER: "${DB_PREFLIGHT_USER:-backupsheep_preflight}"
      DB_PASSWORD_FILE: /run/secrets/db_preflight_password
      RABBITMQ_USER: backupsheep_preflight
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_preflight_password
    secrets:
      - django_secret_key
      - db_preflight_password
      - rabbitmq_preflight_password
      - celery_trusted_public_keys
    command: ["python", "manage.py", "docker_preflight"]
    mem_limit: "${PREFLIGHT_MEMORY_LIMIT:-1g}"
    memswap_limit: "${PREFLIGHT_MEMORY_LIMIT:-1g}"
    cpus: "${PREFLIGHT_CPU_LIMIT:-1.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      db-seal:
        condition: service_completed_successfully
    networks:
      - preflight-database
      - preflight-broker
    logging: *default-logging
    restart: "no"

  app-egress-guard:
    <<: *egress-guard-runtime
    build:
      context: .
      dockerfile: Dockerfile.egress
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: app
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_APP_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_APP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_APP_EGRESS_ALLOW_DNS_NAMES:-}"
    ports:
      - "${BACKUPSHEEP_BIND_ADDRESS:-127.0.0.1}:${BACKUPSHEEP_BIND_PORT:-8000}:8000"
    # restart:no is intentional, so give the guard one deterministic start only
    # after both security-critical peer names are healthy and resolvable.
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      app-database: {}
      app-broker: {}
      app-egress:
        gw_priority: 1

  app:
    <<: *app-runtime
    build:
      context: .
      dockerfile: Dockerfile
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10001:10001"
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: web
      BACKUPSHEEP_DATABASE_LANE: app
      BACKUPSHEEP_CELERY_LANE: app
      DB_USER: "${DB_APP_USER:-backupsheep_app}"
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      RABBITMQ_USER: backupsheep_app
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_app_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_app_private_key
      ONBOARDING_INSTALL_TOKEN_SECRET_FILE: /run/secrets/onboarding_token
      # The web process owns provider setup/OAuth callbacks, notification setup and
      # authenticated log-download URLs, so it is the sole role that needs every
      # deployment-wide integration credential family.
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_STORAGE_BUCKET_NAME: "${S3_STORAGE_BUCKET_NAME:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-}"
      AWS_S3_ACCESS_KEY: "${AWS_S3_ACCESS_KEY:-}"
      AWS_S3_SECRET_ACCESS_KEY: "${AWS_S3_SECRET_ACCESS_KEY:-}"
      AWS_S3_LOGS_BUCKET: "${AWS_S3_LOGS_BUCKET:-}"
      AWS_S3_LOGS_ENDPOINT: "${AWS_S3_LOGS_ENDPOINT:-}"
      AWS_S3_LOGS_REGION: "${AWS_S3_LOGS_REGION:-}"
      LOGS_S3_ACCESS_KEY_ID: "${LOGS_S3_ACCESS_KEY_ID:-}"
      LOGS_S3_SECRET_ACCESS_KEY: "${LOGS_S3_SECRET_ACCESS_KEY:-}"
      LOGS_S3_BUCKET: "${LOGS_S3_BUCKET:-}"
      LOGS_S3_ENDPOINT: "${LOGS_S3_ENDPOINT:-}"
      POSTMARK_API_KEY: "${POSTMARK_API_KEY:-}"
      POSTMARK_DOMAIN: "${POSTMARK_DOMAIN:-}"
      POSTMARK_EMAIL: "${POSTMARK_EMAIL:-}"
      POSTMARK_API_URL: "${POSTMARK_API_URL:-}"
      SES_REGION_NAME: "${SES_REGION_NAME:-}"
      SES_REGION_ENDPOINT: "${SES_REGION_ENDPOINT:-}"
      SES_ACCESS_KEY_ID: "${SES_ACCESS_KEY_ID:-}"
      SES_SECRET_ACCESS_KEY: "${SES_SECRET_ACCESS_KEY:-}"
      AWS_SES_REGION_NAME: "${AWS_SES_REGION_NAME:-}"
      AWS_SES_REGION_ENDPOINT: "${AWS_SES_REGION_ENDPOINT:-}"
      AWS_SES_ACCESS_KEY_ID: "${AWS_SES_ACCESS_KEY_ID:-}"
      AWS_SES_SECRET_ACCESS_KEY: "${AWS_SES_SECRET_ACCESS_KEY:-}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
      MAILGUN_EMAIL: "${MAILGUN_EMAIL:-}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:-}"
      MAILGUN_API_URL: "${MAILGUN_API_URL:-}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-}"
      SLACK_TOKEN_URL: "${SLACK_TOKEN_URL:-}"
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_CLIENT_SECRET: "${SLACK_CLIENT_SECRET:-}"
      TELEGRAM_BOT_KEY: "${TELEGRAM_BOT_KEY:-}"
      DROPBOX_APP_KEY: "${DROPBOX_APP_KEY:-}"
      DROPBOX_APP_SECRET: "${DROPBOX_APP_SECRET:-}"
      PCLOUD_CLIENT_ID: "${PCLOUD_CLIENT_ID:-}"
      PCLOUD_CLIENT_SECRET: "${PCLOUD_CLIENT_SECRET:-}"
      BASECAMP_CLIENT_ID: "${BASECAMP_CLIENT_ID:-}"
      BASECAMP_CLIENT_SECRET: "${BASECAMP_CLIENT_SECRET:-}"
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_OBJECT_ID: "${MS_OBJECT_ID:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-}"
      MS_APPLICATION_ID: "${MS_APPLICATION_ID:-}"
      MS_CLIENT_SECRET_VALUE: "${MS_CLIENT_SECRET_VALUE:-}"
      MS_CLIENT_SECRET_ID: "${MS_CLIENT_SECRET_ID:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      DIGITALOCEAN_APP_CLIENT_ID: "${DIGITALOCEAN_APP_CLIENT_ID:-}"
      DIGITALOCEAN_APP_CLIENT_SECRET: "${DIGITALOCEAN_APP_CLIENT_SECRET:-}"
      OVH_CA_APP_KEY: "${OVH_CA_APP_KEY:-}"
      OVH_CA_APP_SECRET: "${OVH_CA_APP_SECRET:-}"
      OVH_EU_APP_KEY: "${OVH_EU_APP_KEY:-}"
      OVH_EU_APP_SECRET: "${OVH_EU_APP_SECRET:-}"
      OVH_US_APP_KEY: "${OVH_US_APP_KEY:-}"
      OVH_US_APP_SECRET: "${OVH_US_APP_SECRET:-}"
    secrets:
      - django_secret_key
      - db_app_password
      - rabbitmq_app_password
      - celery_signing_app_private_key
      - celery_trusted_public_keys
      - onboarding_token
    # Uses the image ENTRYPOINT (init.sh) to start gunicorn on :8000.
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      app-egress-guard:
        condition: service_healthy
    mem_limit: "${APP_MEMORY_LIMIT:-2g}"
    memswap_limit: "${APP_MEMORY_LIMIT:-2g}"
    cpus: "${APP_CPU_LIMIT:-2.0}"
    volumes:
      # Empty, read-only sentinel volume whose immutable Docker label lets the
      # installer prove project ownership even after `docker compose down` removes
      # all containers and networks. It contains no application or secret data.
      - type: volume
        source: installation_identity
        target: /run/backupsheep-installation
        read_only: true
        volume:
          nocopy: true
    healthcheck: *egress-workload-healthcheck
    network_mode: service:app-egress-guard
    logging: *default-logging
    restart: unless-stopped

  cloud-egress-guard:
    <<: *egress-guard-runtime
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: cloud
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_CLOUD_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_CLOUD_EGRESS_ALLOW_DNS_NAMES:-}"
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      cloud-database: {}
      cloud-broker: {}
      cloud-egress:
        gw_priority: 1

  # API-only provider snapshots + general/notification tasks. Stateless (no _storage
  # or /backups volume), so this is the only worker safe to scale horizontally.
  # Local Storage probes and every deletion path are routed to worker-storage. Cloud
  # tasks just wait on provider HTTP, so concurrency can run high.
  worker-cloud:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10008:10008"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10008,gid=10008
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: cloud
      BACKUPSHEEP_DATABASE_LANE: cloud
      BACKUPSHEEP_CELERY_LANE: cloud
      DB_USER: "${DB_CLOUD_USER:-backupsheep_cloud}"
      DB_PASSWORD_FILE: /run/secrets/db_cloud_password
      RABBITMQ_USER: backupsheep_cloud
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_cloud_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_cloud_private_key
      DIGITALOCEAN_APP_CLIENT_ID: "${DIGITALOCEAN_APP_CLIENT_ID:-}"
      DIGITALOCEAN_APP_CLIENT_SECRET: "${DIGITALOCEAN_APP_CLIENT_SECRET:-}"
      OVH_CA_APP_KEY: "${OVH_CA_APP_KEY:-}"
      OVH_CA_APP_SECRET: "${OVH_CA_APP_SECRET:-}"
      OVH_EU_APP_KEY: "${OVH_EU_APP_KEY:-}"
      OVH_EU_APP_SECRET: "${OVH_EU_APP_SECRET:-}"
      OVH_US_APP_KEY: "${OVH_US_APP_KEY:-}"
      OVH_US_APP_SECRET: "${OVH_US_APP_SECRET:-}"
    secrets:
      - django_secret_key
      - db_cloud_password
      - rabbitmq_cloud_password
      - celery_signing_cloud_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=cloud@%h", "-Q", "cloud,default", "--concurrency=${CELERY_CLOUD_CONCURRENCY:-4}", "--prefetch-multiplier=${CELERY_CLOUD_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_CLOUD_MEMORY_LIMIT:-1g}"
    memswap_limit: "${WORKER_CLOUD_MEMORY_LIMIT:-1g}"
    cpus: "${WORKER_CLOUD_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      cloud-egress-guard:
        condition: service_healthy
    network_mode: service:cloud-egress-guard
    healthcheck: *egress-workload-healthcheck
    logging: *default-logging
    restart: unless-stopped

  database-egress-guard:
    <<: *egress-guard-runtime
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: database
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_DATABASE_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_DATABASE_EGRESS_ALLOW_DNS_NAMES:-}"
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      database-database: {}
      database-broker: {}
      database-egress:
        gw_priority: 1

  # Database dumps (pg_dump/mysqldump). Plaintext remains in the database UID's
  # private volume; storage receives only a published BSE1 handoff.
  worker-database:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10002:10002"
    group_add:
      - "10989"
      - "10990"
      - "10994"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10002,gid=10002
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: database
      BACKUPSHEEP_DATABASE_LANE: database
      DB_USER: "${DB_DATABASE_USER:-backupsheep_database}"
      DB_PASSWORD_FILE: /run/secrets/db_database_password
      BACKUPSHEEP_ARTIFACT_LOCAL_FILE_KEYRING_PATH: /run/secrets/artifact_local_file_database_keyring
      BACKUPSHEEP_CELERY_LANE: database
      RABBITMQ_USER: backupsheep_database
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_database_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_database_private_key
    secrets:
      - django_secret_key
      - db_database_password
      - rabbitmq_database_password
      - celery_signing_database_private_key
      - celery_trusted_public_keys
      - ssh_managed_database_private_key
      - artifact_local_file_database_keyring
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=database@%h", "-Q", "database", "--concurrency=${CELERY_DATABASE_CONCURRENCY:-1}", "--prefetch-multiplier=${CELERY_DATABASE_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_DATABASE_MEMORY_LIMIT:-2g}"
    memswap_limit: "${WORKER_DATABASE_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_DATABASE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      database-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: database_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/database
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        read_only: true
        volume:
          nocopy: true
    network_mode: service:database-egress-guard
    healthcheck: *egress-workload-healthcheck
    logging: *default-logging
    restart: unless-stopped

  files-egress-guard:
    <<: *egress-guard-runtime
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: files
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_FILES_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_FILES_EGRESS_ALLOW_DNS_NAMES:-}"
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      files-database: {}
      files-broker: {}
      files-egress:
        gw_priority: 1

  # Website / Basecamp source material stays private to the files UID.
  worker-files:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10003:10003"
    group_add:
      - "10991"
      - "10992"
      - "10993"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10003,gid=10003
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: files
      BACKUPSHEEP_DATABASE_LANE: files
      DB_USER: "${DB_FILES_USER:-backupsheep_files}"
      DB_PASSWORD_FILE: /run/secrets/db_files_password
      BACKUPSHEEP_ARTIFACT_LOCAL_FILE_KEYRING_PATH: /run/secrets/artifact_local_file_files_keyring
      BACKUPSHEEP_CELERY_LANE: files
      RABBITMQ_USER: backupsheep_files
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_files_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_files_private_key
      BASECAMP_CLIENT_ID: "${BASECAMP_CLIENT_ID:-}"
      BASECAMP_CLIENT_SECRET: "${BASECAMP_CLIENT_SECRET:-}"
    secrets:
      - django_secret_key
      - db_files_password
      - rabbitmq_files_password
      - celery_signing_files_private_key
      - celery_trusted_public_keys
      - ssh_managed_files_private_key
      - artifact_local_file_files_keyring
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=files@%h", "-Q", "files", "--concurrency=${CELERY_FILES_CONCURRENCY:-1}", "--prefetch-multiplier=${CELERY_FILES_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_FILES_MEMORY_LIMIT:-2g}"
    memswap_limit: "${WORKER_FILES_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_FILES_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      files-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: files_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/files
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        read_only: true
        volume:
          nocopy: true
    network_mode: service:files-egress-guard
    healthcheck: *egress-workload-healthcheck
    logging: *default-logging
    restart: unless-stopped

  storage-egress-guard:
    <<: *egress-guard-runtime
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: storage
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_STORAGE_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_STORAGE_EGRESS_ALLOW_DNS_NAMES:-}"
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      storage-database: {}
      storage-broker: {}
      storage-egress:
        gw_priority: 1

  # Dedicated upload pool copies source-owned BSE1 bytes into storage-private work,
  # verifies the durable hash/size, uploads, and cleans only its fenced paths.
  #     ./backupsheep-compose --profile operations up --detach --no-deps --force-recreate --scale worker-storage=4 storage-egress-guard worker-storage
  worker-storage:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10004:10004"
    group_add:
      - "10990"
      - "10992"
      - "10993"
      - "10994"
      - "10995"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10004,gid=10004
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: storage
      BACKUPSHEEP_DATABASE_LANE: storage
      BACKUPSHEEP_CELERY_LANE: storage
      DB_USER: "${DB_STORAGE_USER:-backupsheep_storage}"
      DB_PASSWORD_FILE: /run/secrets/db_storage_password
      RABBITMQ_USER: backupsheep_storage
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_storage_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_storage_private_key
      DROPBOX_APP_KEY: "${DROPBOX_APP_KEY:-}"
      DROPBOX_APP_SECRET: "${DROPBOX_APP_SECRET:-}"
      PCLOUD_CLIENT_ID: "${PCLOUD_CLIENT_ID:-}"
      PCLOUD_CLIENT_SECRET: "${PCLOUD_CLIENT_SECRET:-}"
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_OBJECT_ID: "${MS_OBJECT_ID:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-}"
      MS_APPLICATION_ID: "${MS_APPLICATION_ID:-}"
      MS_CLIENT_SECRET_VALUE: "${MS_CLIENT_SECRET_VALUE:-}"
      MS_CLIENT_SECRET_ID: "${MS_CLIENT_SECRET_ID:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    secrets:
      - django_secret_key
      - db_storage_password
      - rabbitmq_storage_password
      - celery_signing_storage_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=storage@%h", "-Q", "storage", "--concurrency=${CELERY_STORAGE_CONCURRENCY:-2}", "--prefetch-multiplier=${CELERY_STORAGE_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_STORAGE_MEMORY_LIMIT:-2g}"
    memswap_limit: "${WORKER_STORAGE_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_STORAGE_CPU_LIMIT:-2.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      storage-egress-guard:
        condition: service_healthy
    volumes:
      - type: volume
        source: storage_workdir
        target: /code/_storage
        volume:
          nocopy: true
      - type: volume
        source: database_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/database
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: files_ciphertext_transfer
        target: /var/lib/backupsheep/transfer/files
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: restore_ciphertext_transfer
        target: /var/lib/backupsheep/restore-transfer
        volume:
          nocopy: true
      - type: volume
        source: backup_storage
        target: /backups
        volume:
          nocopy: true
    network_mode: service:storage-egress-guard
    healthcheck: *egress-workload-healthcheck
    logging: *default-logging
    restart: unless-stopped

  logs-egress-guard:
    <<: *egress-guard-runtime
    environment:
      <<: *egress-internal-peer-environment
      BACKUPSHEEP_EGRESS_ROLE: logs
      BACKUPSHEEP_EGRESS_MODE: "${BACKUPSHEEP_LOGS_EGRESS_MODE:-deny}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV4:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV6:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV4_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_IPV6_TCP_ENDPOINTS:-}"
      BACKUPSHEEP_EGRESS_ALLOW_DNS_NAMES: "${BACKUPSHEEP_LOGS_EGRESS_ALLOW_DNS_NAMES:-}"
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      logs-database: {}
      logs-broker: {}
      logs-egress:
        gw_priority: 1

  # Log pipeline: writes log entries to the DB (send_log_to_db) and fans out
  # Slack/Telegram notifications. Local run-log pruning executes independently in
  # the database/files/storage lanes that own those private workdirs.
  worker-logs:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10005:10005"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10005,gid=10005
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: logs
      BACKUPSHEEP_DATABASE_LANE: logs
      BACKUPSHEEP_CELERY_LANE: logs
      DB_USER: "${DB_LOGS_USER:-backupsheep_logs}"
      DB_PASSWORD_FILE: /run/secrets/db_logs_password
      RABBITMQ_USER: backupsheep_logs
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_logs_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_logs_private_key
      POSTMARK_API_KEY: "${POSTMARK_API_KEY:-}"
      POSTMARK_DOMAIN: "${POSTMARK_DOMAIN:-}"
      POSTMARK_EMAIL: "${POSTMARK_EMAIL:-}"
      POSTMARK_API_URL: "${POSTMARK_API_URL:-}"
      SES_REGION_NAME: "${SES_REGION_NAME:-}"
      SES_REGION_ENDPOINT: "${SES_REGION_ENDPOINT:-}"
      SES_ACCESS_KEY_ID: "${SES_ACCESS_KEY_ID:-}"
      SES_SECRET_ACCESS_KEY: "${SES_SECRET_ACCESS_KEY:-}"
      AWS_SES_REGION_NAME: "${AWS_SES_REGION_NAME:-}"
      AWS_SES_REGION_ENDPOINT: "${AWS_SES_REGION_ENDPOINT:-}"
      AWS_SES_ACCESS_KEY_ID: "${AWS_SES_ACCESS_KEY_ID:-}"
      AWS_SES_SECRET_ACCESS_KEY: "${AWS_SES_SECRET_ACCESS_KEY:-}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
      MAILGUN_EMAIL: "${MAILGUN_EMAIL:-}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:-}"
      MAILGUN_API_URL: "${MAILGUN_API_URL:-}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-}"
      SLACK_TOKEN_URL: "${SLACK_TOKEN_URL:-}"
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_CLIENT_SECRET: "${SLACK_CLIENT_SECRET:-}"
      TELEGRAM_BOT_KEY: "${TELEGRAM_BOT_KEY:-}"
    secrets:
      - django_secret_key
      - db_logs_password
      - rabbitmq_logs_password
      - celery_signing_logs_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--hostname=logs@%h", "-Q", "logs", "--concurrency=${CELERY_LOGS_CONCURRENCY:-2}", "--prefetch-multiplier=${CELERY_LOGS_PREFETCH_MULTIPLIER:-1}"]
    profiles: ["operations"]
    mem_limit: "${WORKER_LOGS_MEMORY_LIMIT:-512m}"
    memswap_limit: "${WORKER_LOGS_MEMORY_LIMIT:-512m}"
    cpus: "${WORKER_LOGS_CPU_LIMIT:-1.0}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
      logs-egress-guard:
        condition: service_healthy
    network_mode: service:logs-egress-guard
    healthcheck: *egress-workload-healthcheck
    logging: *default-logging
    restart: unless-stopped

  beat:
    <<: *app-runtime
    image: "${BACKUPSHEEP_IMAGE:-backupsheep:local}"
    user: "10006:10006"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKUPSHEEP_TMPFS_SIZE:-256m},mode=1777
      - /run/backupsheep:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10006,gid=10006
    environment:
      <<: *app-secret-environment
      BACKUPSHEEP_RUNTIME_ROLE: beat
      BACKUPSHEEP_DATABASE_LANE: beat
      BACKUPSHEEP_CELERY_LANE: beat
      DB_USER: "${DB_BEAT_USER:-backupsheep_beat}"
      DB_PASSWORD_FILE: /run/secrets/db_beat_password
      RABBITMQ_USER: backupsheep_beat
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_beat_password
      CELERY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/celery_signing_beat_private_key
    secrets:
      - django_secret_key
      - db_beat_password
      - rabbitmq_beat_password
      - celery_signing_beat_private_key
      - celery_trusted_public_keys
    command: ["celery", "-A", "backupsheep", "beat", "--loglevel=info", "--scheduler", "backupsheep.scheduler:BackupDatabaseScheduler"]
    profiles: ["operations"]
    mem_limit: "${BEAT_MEMORY_LIMIT:-512m}"
    memswap_limit: "${BEAT_MEMORY_LIMIT:-512m}"
    cpus: "${BEAT_CPU_LIMIT:-0.5}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
      staging-provision:
        condition: service_completed_successfully
    networks:
      - beat-database
      - beat-broker
    logging: *default-logging
    restart: unless-stopped

networks:
  app-database: *internal-network
  app-broker: *internal-network
  migrate-database: *internal-network
  cloud-database: *internal-network
  cloud-broker: *internal-network
  database-database: *internal-network
  database-broker: *internal-network
  files-database: *internal-network
  files-broker: *internal-network
  storage-database: *internal-network
  storage-broker: *internal-network
  logs-database: *internal-network
  logs-broker: *internal-network
  beat-database: *internal-network
  beat-broker: *internal-network
  preflight-database: *internal-network
  preflight-broker: *internal-network
  provision-database: *internal-network
  provision-broker: *internal-network
  app-egress: *egress-network
  cloud-egress: *egress-network
  database-egress: *egress-network
  files-egress: *egress-network
  storage-egress: *egress-network
  logs-egress: *egress-network

volumes:
  # New Alpine/ICU generation only. `${project}_pgdata` is retained detached after
  # an explicit logical migration so rollback never depends on destructive adoption.
  postgres_data_v1:
    labels: *installation-labels
  rabbitmq_data:
  # Legacy shared work is visible only to staging-provision. Existing installs must
  # prove it empty before the new per-lane layout receives a durable witness.
  backup_workdir:
  database_workdir:
  files_workdir:
  storage_workdir:
  database_ciphertext_transfer:
  files_ciphertext_transfer:
  restore_ciphertext_transfer:
  staging_layout_witness:
  # This is where 'Local Storage' backups live (mounted at /backups only in the
  # storage worker). To keep backups on a big disk or an NFS share instead of the
  # Docker-managed volume, override with a bind mount in docker-compose.override.yml:
  #   volumes:
  #     backup_storage:
  #       driver: local
  #       driver_opts:
  #         type: none
  #         o: bind
  #         device: /mnt/storage/backupsheep
  backup_storage:
  installation_identity:
    labels: *installation-labels

# Compose bind-mounts these installation files read-only under /run/secrets,
# so their values never appear in container inspection. Environment-sourced Compose
# secrets cannot be materialized into an immutable root filesystem; the installer
# therefore owns `.secrets` as a mode-0700 directory containing mode-0444 files. The
# private directory blocks host traversal while the bind-mounted file stays readable by
# the non-root container UID. This is application state, not a host-security change.
secrets:
  django_secret_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/django_secret_key
  db_bootstrap_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_bootstrap_password
  db_migrator_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_migrator_password
  db_app_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_app_password
  db_preflight_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_preflight_password
  db_beat_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_beat_password
  db_cloud_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_cloud_password
  db_database_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_database_password
  db_files_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_files_password
  db_storage_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_storage_password
  db_logs_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/db_logs_password
  rabbitmq_bootstrap_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_bootstrap_password
  rabbitmq_app_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_app_password
  rabbitmq_preflight_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_preflight_password
  rabbitmq_beat_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_beat_password
  rabbitmq_cloud_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_cloud_password
  rabbitmq_database_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_database_password
  rabbitmq_files_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_files_password
  rabbitmq_storage_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_storage_password
  rabbitmq_logs_password:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/rabbitmq_logs_password
  celery_signing_app_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_app_private_key
  celery_signing_beat_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_beat_private_key
  celery_signing_cloud_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_cloud_private_key
  celery_signing_database_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_database_private_key
  celery_signing_files_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_files_private_key
  celery_signing_storage_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_storage_private_key
  celery_signing_logs_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_signing_logs_private_key
  celery_trusted_public_keys:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/celery_trusted_public_keys
  onboarding_token:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/onboarding_token
  ssh_managed_database_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/ssh_managed_database_private_key
  ssh_managed_files_private_key:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/ssh_managed_files_private_key
  artifact_local_file_database_keyring:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/artifact_local_file_database_keyring
  artifact_local_file_files_keyring:
    file: ${BACKUPSHEEP_SECRETS_DIR:-.secrets}/artifact_local_file_files_keyring
